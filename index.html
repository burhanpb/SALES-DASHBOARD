  --bg: #f4f6f8;

  --card-bg: #17222f;
  --border: #2c3c4e;

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; }
#root { min-height: 100vh; }

/* Login */
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }

.login-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 18px; }
.login-error { background: var(--highlight-bg); color: var(--danger); padding: 8px 10px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }
.field-label { font-size: 12px; font-weight: 600; color: var(--text-muted); margin: 10px 0 4px; text-transform: uppercase; letter-spacing: .03em; }

.btn-small { padding: 6px 10px; font-size: 12px; }
.btn-icon { padding: 8px 10px; font-size: 15px; line-height: 1; }

.topbar { background: var(--header-bg); color: var(--header-text); display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; flex-wrap: wrap; gap: 8px; }

.topbar-user { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.user-badge { background: rgba(255,255,255,0.12); padding: 6px 10px; border-radius: 999px; }

.statusbar { background: var(--statusbar-bg); border-bottom: 1px solid var(--border); padding: 6px 16px; }
.statusbar-inner { display: flex; align-items: center; gap: 12px; font-size: 12px; flex-wrap: wrap; }

.status-loading { color: var(--accent-dark); }

.filterbar { background: var(--card-bg); border-bottom: 1px solid var(--border); padding: 10px 16px; position: sticky; top: 0; z-index: 5; }

.multiselect { position: relative; }
.multiselect-summary { border: 1px solid var(--border); background: var(--input-bg); border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; min-width: 110px; text-align: left; color: var(--text); }

.searchbar { margin-top: 4px; }

.page-title { font-size: 17px; margin: 6px 0 14px; color: var(--header-bg); }

<!-- ===================================================================
     ACCESS GATE — a single shared password every company user knows,
     shown before anything else on the page. This is NOT the per-person
     login below (that still asks for each salesman's own name + PIN and
     still only shows that person their own data) — this is just the
     outer front door that keeps random internet visitors from ever
     reaching this page at all. The password is checked by comparing a
     SHA-256 hash, so it isn't sitting in the page as plain readable
     text — but this still runs entirely in the visitor's own browser,
     so it stops casual/accidental visitors, not a determined technical
     person willing to dig through the page's code. Once entered
     correctly on a device, it's remembered there so it's not asked
     again on that device. =================================================================== -->
<div id="gate" class="login-wrap">
  <div class="login-card">
    <div class="login-title">ZBM Sales Dashboard</div>
    <div class="login-sub">Enter the company access password to continue</div>
    <div id="gateError" class="login-error" style="display:none"></div>
    <label class="field-label">Access password</label>
    <input id="gatePass" class="input" type="password" placeholder="Access password" autocomplete="off">
    <button id="gateBtn" class="btn btn-primary btn-block">Continue</button>
    <div class="gate-note">This is separate from your personal login on the next screen.</div>
  </div>
</div>

<script>
/* Access gate logic — deliberately self-contained (no dependency on the
   app's own helpers below) so it runs immediately as soon as this tag
   is reached, before the rest of the page's script even loads. */
(function () {
  // SHA-256 of the shared company password. Never store the password
  // itself here in plain text — only this fingerprint of it.
  var GATE_HASH = "f19f2461d10dbc436089c90720a0287407128012e99f48e770db49830d6fc265";
  var STORAGE_KEY = "zbm_gate_ok_v1";

  function sha256Hex(str) {
    var enc = new TextEncoder().encode(str);
    return crypto.subtle.digest("SHA-256", enc).then(function (buf) {
      return Array.prototype.map.call(new Uint8Array(buf), function (b) {
        return b.toString(16).padStart(2, "0");
      }).join("");
    });
  }

  function unlock(remember) {
    if (remember) { try { localStorage.setItem(STORAGE_KEY, "1"); } catch (e) {} }
    document.getElementById("gate").style.display = "none";
    document.getElementById("root").style.display = "";
    window.__gateUnlocked = true;
    document.dispatchEvent(new Event("gateUnlocked"));
  }

  function attempt() {
    var val = document.getElementById("gatePass").value;
    var btn = document.getElementById("gateBtn");
    btn.disabled = true;
    sha256Hex(val).then(function (hex) {
      btn.disabled = false;
      if (hex === GATE_HASH) {
        unlock(true);
      } else {
        var e = document.getElementById("gateError");
        e.textContent = "Incorrect password. Please try again.";
        e.style.display = "";
        document.getElementById("gatePass").value = "";
        document.getElementById("gatePass").focus();
      }
    });
  }

  var already = false;
  try { already = localStorage.getItem(STORAGE_KEY) === "1"; } catch (e) {}
  if (already) {
    unlock(false);
  } else {
    document.getElementById("gateBtn").addEventListener("click", attempt);
    document.getElementById("gatePass").addEventListener("keydown", function (e) {
      if (e.key === "Enter") attempt();
    });
    document.getElementById("gatePass").focus();
  }
})();
</script>

   2b. "TIME GONE %" — how far through the CURRENT real-world month we
   are, used to color Ach%/Dist% cells red (behind pace) or green (on/
   ahead of pace). Formula: (today's day-of-month - 1) / days-in-that-
   month, expressed as a percentage. A month that's already fully in the
   past (viewing a previous month) is 100% gone; a future month is 0%
   gone (shouldn't normally come up, but handled just in case). Days in
   month correctly accounts for 28/29/30/31 and leap years via the
   "day 0 of next month" trick below.
   --------------------------------------------------------------------- */
function daysInMonth(year, month1based) {
  return new Date(year, month1based, 0).getDate();
}
function computeTimeGonePct(monthKey) {
  const m = /^(\d{4})-(\d{2})$/.exec(monthKey || "");
  if (!m) return 100;
  const year = Number(m[1]), month = Number(m[2]); // month is 1-based
  const today = new Date();
  const curYear = today.getFullYear(), curMonth = today.getMonth() + 1;
  if (year < curYear || (year === curYear && month < curMonth)) return 100; // fully past month
  if (year > curYear || (year === curYear && month > curMonth)) return 0;   // future month
  const total = daysInMonth(year, month);
  const pct = ((today.getDate() - 1) / total) * 100;
  return Math.max(0, Math.min(100, pct));
}

/* ---------------------------------------------------------------------
   3. GENERIC HELPERS
   --------------------------------------------------------------------- */
function normKey(s) {
  return String(s == null ? "" : s).trim().toLowerCase().replace(/[^a-z0-9]/g, "");
}
function normVal(s) {
  return String(s == null ? "" : s).trim().toLowerCase();
}
function parseNum(v) {
  if (v == null || v === "") return 0;
  const n = parseFloat(String(v).replace(/,/g, "").trim());
  return isNaN(n) ? 0 : n;
}
function fmtNum(n, dp) {
  dp = dp == null ? 0 : dp;
  if (n == null || isNaN(n)) n = 0;
  return n.toLocaleString(undefined, { minimumFractionDigits: dp, maximumFractionDigits: dp });
}
function fmtPct(n) {
  if (n == null || isNaN(n) || !isFinite(n)) return "0.0%";
  return n.toFixed(1) + "%";
}
function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}

/* Build a normalized-header -> actual-header lookup for a parsed CSV row set */
function buildHeaderMap(fields) {
  const map = {};
  (fields || []).forEach((f) => { map[normKey(f)] = f; });
  return map;
}
/* Get a field's value from a row, trying several candidate header names (already normalized-friendly) */
function getField(row, headerMap, candidates) {
  for (const c of candidates) {
    const key = headerMap[normKey(c)];
    if (key !== undefined && row[key] !== undefined) return row[key];
  }
  return "";
}

/* ---------------------------------------------------------------------
   4. SHEET FETCH LAYER

   IMPORTANT — two things learned the hard way:

   (a) We deliberately do NOT use fetch()/XHR against the Google Sheets
   gviz endpoint, and — after testing against a real browser — we also
   do NOT use Google's own `google.visualization.Query` client library,
   even though that's the "official" way. That library turns out to
   issue a plain XMLHttpRequest internally, which gets blocked by CORS
   exactly like fetch() does ("No 'Access-Control-Allow-Origin' header
   is present"), confirmed via a real Chrome console. Instead we do the
   underlying script-injection (JSONP) trick ourselves: gviz's default
   JSON response is always wrapped as a call to the fixed global
   function `google.visualization.Query.setResponse(...)` (this is NOT
   configurable via the documented `responseHandler` tqx param — that
   param is silently ignored; confirmed directly against the real
   sheet), so we define that exact function ourselves and load the
   query URL via a <script> tag. Script tags are never subject to CORS,
   which is why this works where fetch/XHR cannot. Concurrent queries
   are matched back to their caller via the `reqId` tqx param, which
   gviz echoes back verbatim in the response.

   (b) The TARGET sheet is NOT small — it holds one row per (salesman,
   SKU, outlet) combination, which is 200,000+ rows for a single month.
   Downloading that whole sheet into a phone's browser is exactly what
   caused "Request timed out" in testing. So for the TARGET sheet we
   never pull raw rows: every number is computed *on Google's servers*
   using the Google Visualization Query Language (a SQL-like `select /
   where / group by / order by / limit` syntax gviz supports natively),
   and only the small aggregated result comes back to the browser.

   The SALES sheet is far smaller (a few thousand rows/month across the
   whole company) so it's fetched as real rows and aggregated in the
   browser exactly like before — that part didn't need to change.
   --------------------------------------------------------------------- */
/* Wrap a raw gviz JSON "table" object ({cols:[...], rows:[...]}) in the
   same minimal interface our code already uses everywhere a
   google.visualization.DataTable used to be returned, so no caller
   needed to change. */
function wrapGvizTable(table) {
  const cols = (table && table.cols) || [];
  const rows = (table && table.rows) || [];
  return {
    getNumberOfColumns: () => cols.length,
    getNumberOfRows: () => rows.length,
    getColumnLabel: (c) => (cols[c] ? cols[c].label : ""),
    getColumnId: (c) => (cols[c] ? cols[c].id : null),
    getValue: (r, c) => {
      const row = rows[r];
      const cell = row && row.c ? row.c[c] : null;
      if (!cell || cell.v === undefined) return null;
      return cell.v;
    },
  };
}

/* Install the one global handler gviz always calls (regardless of any
   responseHandler param), and route each response back to the pending
   query that requested it via the echoed-back reqId. Installed once. */
const _gvizPending = {};
(function installGvizResponseHandler() {
  window.google = window.google || {};
  window.google.visualization = window.google.visualization || {};
  window.google.visualization.Query = window.google.visualization.Query || {};
  window.google.visualization.Query.setResponse = function (response) {
    const reqId = String(response && response.reqId);
    const pending = _gvizPending[reqId];
    if (!pending) return; // stale (already timed out) or unknown — ignore
    delete _gvizPending[reqId];
    clearTimeout(pending.timer);
    if (pending.script.parentNode) pending.script.parentNode.removeChild(pending.script);
    if (!response || response.status === "error") {
      const err = (response && response.errors && response.errors[0]) || {};
      pending.reject(new Error(
        "Sheet query failed (" + (err.reason || "error") + "): " + (err.detailed_message || err.message || "") +
        ". Make sure the sheet is shared as 'Anyone with the link can view' (or edit)."
      ));
      return;
    }
    pending.resolve(wrapGvizTable(response.table));
  };
})();

/* ---------------------------------------------------------------------
   OPTIONAL RELIABILITY PROXY

   Every phone querying Google's public gviz endpoint directly (below) is
   what causes the intermittent "sheet query timed out" under real load —
   many anonymous requests hitting the same publicly-shared sheet at once
   is exactly the kind of traffic that endpoint isn't built to sustain.

   If you deploy the companion Google Apps Script Web App (see the setup
   guide) and paste its URL here, every query instead goes through that
   one script — which fetches Google Sheets with your own account's
   normal access (not the shaky anonymous public link) and caches results
   for ~2 minutes so many people opening the dashboard around the same
   time share one fetch instead of each hitting Google separately.

   Leave this blank to keep using the direct method (still works, still
   has the retry/backoff below, just more exposed to the same crowding). */
const GVIZ_PROXY_URL = ""; // tried an Apps Script proxy here — reverted, see conversation:
                            // its own cold-start latency was wildly unpredictable
                            // (2s to 47s for the identical cached query), which is worse
                            // than querying Google directly (consistently sub-second in
                            // testing). Left the plumbing in place in case a future,
                            // properly warmed/authenticated backend is worth revisiting.
/* --------------------------------------------------------------------- */

/* Ask the Apps Script proxy to run this GQL query and hand back its
   already-unwrapped JSON. Same transient/non-transient error contract as
   the direct script-tag method below, so the retry wrapper further down
   treats both identically. */
async function runGvizQueryViaProxy(proxyUrl, sheetId, gql, timeoutMs) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  const url = proxyUrl + (proxyUrl.indexOf("?") >= 0 ? "&" : "?") +
    "sheetId=" + encodeURIComponent(sheetId) + "&gql=" + encodeURIComponent(gql);

  let resp;
  try {
    resp = await fetch(url, { signal: controller.signal });
  } catch (fetchErr) {
    clearTimeout(timer);
    const err = new Error(
      fetchErr && fetchErr.name === "AbortError"
        ? "Sheet query timed out. Make sure the sheet is shared as 'Anyone with the link can view' (or edit)."
        : "Could not reach the report server. Check your internet connection."
    );
    err.gvizTransient = true;
    throw err;
  }
  clearTimeout(timer);

  let response;
  try {
    response = await resp.json();
  } catch (parseErr) {
    const err = new Error("Report server returned an unexpected response. Try Refresh.");
    err.gvizTransient = true; // worth one retry — could be a mid-deploy blip
    throw err;
  }

  if (!response || response.status === "error") {
    const errInfo = (response && response.errors && response.errors[0]) || {};
    // A real query/sharing error, not a network blip — retrying won't help.
    throw new Error(
      "Sheet query failed (" + (errInfo.reason || "error") + "): " + (errInfo.message || errInfo.detailed_message || "") +
      ". Make sure the sheet is shared as 'Anyone with the link can view' (or edit)."
    );
  }
  return wrapGvizTable(response.table);
}

/* Run a Google Visualization Query Language string against a sheet via
   script-injection (JSONP) — see the note above on why this is used
   instead of fetch()/XHR or Google's own Query client library.
   Resolves with a DataTable-like object (caller decides how to read it).
   This is the direct-to-Google fallback; runGvizQueryOnce below picks
   this or the proxy method depending on GVIZ_PROXY_URL. */
let _gvizReqCounter = 0;
function runGvizQueryViaScriptTag(sheetId, gql, timeoutMs, baseOverride) {
  return new Promise((resolve, reject) => {
    const reqId = String(_gvizReqCounter++);
    const script = document.createElement("script");
    const timer = setTimeout(() => {
      if (!_gvizPending[reqId]) return;
      delete _gvizPending[reqId];
      if (script.parentNode) script.parentNode.removeChild(script);
      const err = new Error("Sheet query timed out. Make sure the sheet is shared as 'Anyone with the link can view' (or edit).");
      err.gvizTransient = true;
      reject(err);
    }, timeoutMs);
    _gvizPending[reqId] = { resolve, reject, script, timer };
    script.onerror = function () {
      if (!_gvizPending[reqId]) return;
      delete _gvizPending[reqId];
      clearTimeout(timer);
      const err = new Error("Could not reach the Google Sheet (script failed to load). Check your internet connection.");
      err.gvizTransient = true;
      reject(err);
    };
    const base = baseOverride || "https://docs.google.com/spreadsheets/d/";
    const url = base + sheetId +
      "/gviz/tq?tqx=reqId:" + reqId + "&tq=" + encodeURIComponent(gql);
    script.src = url;
    document.head.appendChild(script);
  });
}

/* Picks the transport: the proxy (if configured) unless a test override
   is forcing the direct method against a local fake server. */
function runGvizQueryOnce(sheetId, gql, timeoutMs) {
  const testBase = (typeof window !== "undefined" && window.__GVIZ_BASE_OVERRIDE__) || null;
  const proxyUrl = (typeof window !== "undefined" && window.__GVIZ_PROXY_OVERRIDE__) || GVIZ_PROXY_URL;
  if (proxyUrl && !testBase) {
    return runGvizQueryViaProxy(proxyUrl, sheetId, gql, timeoutMs);
  }
  return runGvizQueryViaScriptTag(sheetId, gql, timeoutMs, testBase);
}

function _sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

/* Run an array of zero-arg task functions (each returning a promise) with
   at most `limit` in flight at once, preserving result order. Browsers cap
   concurrent connections per host (~6), and on login we fire many gviz
   queries at once — piling them all into one Promise.all() queues most of
   them behind the connection cap anyway while making every one of them
   race the same 20s-per-attempt clock, which is a big part of why loads
   were timing out under real mobile network conditions. Batching keeps
   each in-flight request's timeout meaningful. */
function runLimited(tasks, limit) {
  const results = new Array(tasks.length);
  let next = 0;
  function worker() {
    const i = next++;
    if (i >= tasks.length) return Promise.resolve();
    return tasks[i]().then((r) => { results[i] = r; return worker(); });
  }
  const workers = [];
  for (let w = 0; w < Math.min(limit, tasks.length); w++) workers.push(worker());
  return Promise.all(workers).then(() => results);
}

/* Public entry point every caller uses. Google's public gviz endpoint is
   flaky under real-world mobile networks and concurrent access from many
   phones hitting the same sheet at once — a single slow/blipped request
   is common and NOT a real failure. So: retry transient failures (timeout
   or script-load failure) a couple of times with backoff before surfacing
   an error to the user. A genuine query error (bad GQL, sheet not shared)
   comes back from gviz as response.status === "error" — wrapped as a
   *non*-transient rejection in setResponse above — and is never retried,
   since retrying won't fix it. */
function runGvizQuery(sheetId, gql, attempt) {
  attempt = attempt || 1;
  const maxAttempts = 3;
  // Overridable only for automated tests exercising the retry path itself.
  const timeoutMs = (typeof window !== "undefined" && window.__GVIZ_TIMEOUT_OVERRIDE_MS__) || 20000;
  return runGvizQueryOnce(sheetId, gql, timeoutMs).catch((err) => {
    if (err && err.gvizTransient && attempt < maxAttempts) {
      return _sleep(attempt * 700).then(() => runGvizQuery(sheetId, gql, attempt + 1));
    }
    throw err;
  });
}

/* Escape a value for use inside a single-quoted GQL string literal. */
function escGQL(v) {
  return String(v == null ? "" : v).replace(/'/g, "''");
}

/* Resolve {normalizedHeaderName -> spreadsheet column id (e.g. "A","B",...)}
   for a sheet by asking for just one row. Cached per sheetId since a
   sheet's column layout doesn't change between refreshes. */
const _colMapCache = {};
function resolveColumnMap(sheetId) {
  if (_colMapCache[sheetId]) return Promise.resolve(_colMapCache[sheetId]);
  return runGvizQuery(sheetId, "select * limit 1").then((dt) => {
    const map = {};
    for (let c = 0; c < dt.getNumberOfColumns(); c++) {
      map[normKey(dt.getColumnLabel(c))] = dt.getColumnId(c);
    }
    _colMapCache[sheetId] = map;
    return map;
  });
}

/* Get a column's letter-id from a resolved column map, trying candidate
   header names in order. Throws a clear error if none match (e.g. the
   sheet's headers were renamed). */
function colId(map, candidates) {
  for (const c of candidates) {
    const id = map[normKey(c)];
    if (id) return id;
  }
  throw new Error("Could not find a column matching any of: " + candidates.join(", ") +
    " — check the sheet's header row hasn't been renamed.");
}

function fetchSheetRows(sheetId, gqlWhere) {
  const q = "select *" + (gqlWhere ? " where " + gqlWhere : "");
  return runGvizQuery(sheetId, q).then(dataTableToRows);
}

function dataTableToRows(dt) {
  const nCols = dt.getNumberOfColumns();
  const headers = [];
  for (let c = 0; c < nCols; c++) headers.push(dt.getColumnLabel(c) || ("col" + c));
  const headerMap = buildHeaderMap(headers);
  const rows = [];
  const nRows = dt.getNumberOfRows();
  for (let r = 0; r < nRows; r++) {
    const rawRow = {};
    for (let c = 0; c < nCols; c++) {
      let v = dt.getValue(r, c);
      if (v instanceof Date) v = v.toISOString();
      rawRow[headers[c]] = v;
    }
    rows.push(normalizeRow(rawRow, headerMap));
  }
  return rows;
}

/* Normalize one raw CSV row (target or sales) into a flat, typed object with a
   consistent field set regardless of small header naming differences. */
function normalizeRow(row, headerMap) {
  const agency     = getField(row, headerMap, ["Agency"]);
  const brand      = getField(row, headerMap, ["Brand"]);
  const subCat     = getField(row, headerMap, ["SubCategory", "Sub Category", "Sub Cat"]);
  const prodGroup  = getField(row, headerMap, ["Product Group"]); // Food / Non Food
  const itemCode   = getField(row, headerMap, ["Item Code"]);
  const itemDesc   = getField(row, headerMap, ["Item Desc"]);
  const promoReg   = getField(row, headerMap, ["Promo_Regular ?", "Promo_Regular", "Promo Regular"]);
  const collector  = getField(row, headerMap, ["Collector"]); // salesman username
  const custGroup  = getField(row, headerMap, ["Cust Group"]);
  const custCode   = getField(row, headerMap, ["Cust Site Code"]);
  const custSite   = getField(row, headerMap, ["Cust Site"]);
  const state      = getField(row, headerMap, ["State"]);
  const channel    = getField(row, headerMap, ["Channel"]);
  const custType   = getField(row, headerMap, ["Cust Type"]);
  const yr         = getField(row, headerMap, ["Yr"]);
  const mnth       = getField(row, headerMap, ["Mnth"]);
  const day        = getField(row, headerMap, ["Day"]);
  const salesVal   = parseNum(getField(row, headerMap, ["Sales"]));
  const shippedCs  = parseNum(getField(row, headerMap, ["Shipped Cases"]));
  const retQtyCs   = parseNum(getField(row, headerMap, ["Return Qty(Cases)", "Return Qty (Cases)"]));
  const retQtyPcs  = parseNum(getField(row, headerMap, ["Return Qty(Pcs)", "Return Qty (Pcs)"]));
  const retVal     = parseNum(getField(row, headerMap, ["Return Val"]));
  const entry      = getField(row, headerMap, ["ENTRY"]);
  const managers   = getField(row, headerMap, ["MANAGERS"]);
  const kcGroup    = getField(row, headerMap, ["KC GROUP"]);
  const dept       = getField(row, headerMap, ["DEPT"]);
  const type       = getField(row, headerMap, ["TYPE"]); // PURCHASE / RETURN (sales file) or TARGET (target file)
  const type2      = getField(row, headerMap, ["TYPE 2"]); // KC / DELICIO / TWINNING / KDD / NON KC grouping
  const group      = getField(row, headerMap, ["GROUP"]); // Major / Other (currently blank)

  return {
    agency: String(agency).trim(),
    brand: String(brand).trim(),
    subCat: String(subCat).trim(),
    prodGroup: String(prodGroup).trim(),
    itemCode: String(itemCode).trim(),
    itemDesc: String(itemDesc).trim(),
    promoReg: String(promoReg).trim().toUpperCase(),
    collector: String(collector).trim(),
    custGroup: String(custGroup).trim(),
    custCode: String(custCode).trim(),
    custSite: String(custSite).trim(),
    state: String(state).trim(),
    channel: String(channel).trim(),
    custType: String(custType).trim(),
    yr: String(yr).trim(),
    mnth: String(mnth).trim(),
    day: String(day).trim(),
    sales: salesVal,
    shippedCases: shippedCs,
    returnQtyCases: retQtyCs,
    returnQtyPcs: retQtyPcs,
    returnVal: retVal,
    entry: String(entry).trim(),
    managers: String(managers).trim(),
    kcGroup: String(kcGroup).trim(),
    dept: String(dept).trim(),
    type: normVal(type), // lower-cased for matching: 'purchase' / 'return' / 'target'
    type2: String(type2).trim(),
    group: String(group).trim(),
    // derived
    lastDate: buildDateKey(yr, mnth, day),
  };
}

function MONTH_NUM(mnthStr) {
  const m = normVal(mnthStr).slice(0, 3);
  const map = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
  return map[m] || 0;
}
function buildDateKey(yr, mnth, day) {
  const y = parseInt(yr, 10) || 0;
  const m = MONTH_NUM(mnth);
  const d = parseInt(day, 10) || 1;
  if (!y || !m) return null;
  return y * 10000 + m * 100 + d; // sortable int, e.g. 20260815
}
function dateKeyToLabel(k) {
  if (!k) return "-";
  const y = Math.floor(k / 10000);
  const m = Math.floor((k % 10000) / 100);
  const d = k % 100;
  const names = ["", "Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  return `${d} ${names[m]} ${y}`;
}

/* ---------------------------------------------------------------------
   5. ROLE-BASED SCOPING + FILTERS, AS A GQL WHERE CLAUSE

   Because the TARGET sheet is too large to pull client-side (see above),
   role scoping and every dashboard filter get compiled into a GQL WHERE
   clause and sent to Google's servers, which do the filtering. `colMap`
   is the {field -> column letter} map for whichever sheet this clause
   will run against (TARGET and SALES have different column layouts).
   `opts.forSales` additionally restricts to real transaction rows only
   (see note on the SALES sheet's TYPE column below).
   --------------------------------------------------------------------- */
function eqAny(colLetter, values) {
  return "(" + values.map((v) => `${colLetter} = '${escGQL(v)}'`).join(" or ") + ")";
}

/* Like eqAny, but for columns that are numeric in the sheet (e.g. "Item
   Code", "Cust Site Code" are both stored as numbers, confirmed against
   the real sheet). GQL rejects/never-matches a numeric column compared
   to a quoted string literal, so purely-numeric-looking values are
   emitted unquoted here. This was the exact cause of "Dist Target"
   silently coming back 0 everywhere restrictToKeys was used. */
function eqAnyNumericSafe(colLetter, values) {
  return "(" + values.map((v) => {
    const s = String(v);
    return (s !== "" && !isNaN(Number(s))) ? `${colLetter} = ${Number(s)}` : `${colLetter} = '${escGQL(s)}'`;
  }).join(" or ") + ")";
}

function buildGqlWhere(colMap, user, filters, opts) {
  opts = opts || {};
  const clauses = [];

  // Role scope
  if (!FULL_ACCESS_TITLES.includes(user.title)) {
    if (user.title === "MANAGER") {
      clauses.push(eqAny(colId(colMap, ["MANAGERS"]), [user.username]));
    } else {
      clauses.push(eqAny(colId(colMap, ["Collector"]), [user.username]));
    }
  }

  // Global filters
  if (filters.agency && filters.agency.length) clauses.push(eqAny(colId(colMap, ["Agency"]), filters.agency));
  if (filters.prodGroup && filters.prodGroup !== "ALL") clauses.push(eqAny(colId(colMap, ["Product Group"]), [filters.prodGroup]));
  if (filters.promoReg && filters.promoReg !== "ALL") clauses.push(eqAny(colId(colMap, ["Promo_Regular ?", "Promo_Regular"]), [filters.promoReg]));
  if (filters.custGroup && filters.custGroup.length) clauses.push(eqAny(colId(colMap, ["Cust Group"]), filters.custGroup));
  if (filters.majorOther && filters.majorOther !== "ALL") clauses.push(eqAny(colId(colMap, ["GROUP"]), [filters.majorOther]));
  // Salesmen/Managers filters only make sense (and are only shown) for manager-tier users
  if (filters.salesmen && filters.salesmen.length) clauses.push(eqAny(colId(colMap, ["Collector"]), filters.salesmen));
  if (filters.managers && filters.managers.length) clauses.push(eqAny(colId(colMap, ["MANAGERS"]), filters.managers));

  // Search box: substring match across text fields; exact match against the
  // numeric Item Code / Cust Site Code columns (GQL's CONTAINS needs a string
  // column, so a numeric-column substring match isn't supported server-side).
  if (filters.search && filters.search.trim()) {
    const term = filters.search.trim();
    const q = escGQL(term);
    const textFields = [
      ["Item Desc"], ["Cust Site"], ["Agency"], ["Brand"], ["SubCategory", "Sub Category"],
    ];
    const ors = textFields.map((cands) => `upper(${colId(colMap, cands)}) contains upper('${q}')`);
    const num = parseFloat(term);
    if (!isNaN(num)) {
      ors.push(`${colId(colMap, ["Item Code"])} = ${num}`);
      ors.push(`${colId(colMap, ["Cust Site Code"])} = ${num}`);
    }
    clauses.push("(" + ors.join(" or ") + ")");
  }

  // NOTE: an earlier version excluded SALES rows with TYPE="TARGET" here,
  // assuming they were unrelated noise. Verified against the real sheet
  // that assumption was wrong — TYPE="TARGET" rows carry real Sales and
  // Return Val figures that the user's own reference numbers include
  // (confirmed by matching their Achievement and Return totals for a
  // specific salesman almost to the decimal once these rows were added
  // back in). So every row is now fetched regardless of TYPE; opts.forSales
  // is kept as a no-op parameter for callers rather than removed outright,
  // in case a future month's sheet needs a real exclusion after all.
  void opts.forSales;

  return clauses.length ? clauses.join(" and ") : null; // null = no WHERE needed at all
}

/* Join possibly-null clause fragments with AND, omitting empty ones.
   Returns null if every fragment was empty (caller should skip WHERE
   entirely rather than send a clause GQL might reject, e.g. "1=1"). */
function andJoin(...parts) {
  const nonEmpty = parts.filter(Boolean);
  return nonEmpty.length ? nonEmpty.join(" and ") : null;
}
function whereSuffix(clause) {
  return clause ? " where " + clause : "";
}

/* ---------------------------------------------------------------------
   6. CLIENT-SIDE FILTER APPLICATION (SALES rows only)
   The SALES sheet is small enough to fetch as raw rows once per
   month/login (already scoped to this user's role + real transactions
   via buildGqlWhere), then re-filtered instantly in the browser as the
   user toggles filters — no extra network round-trip needed for this
   part. filterState fields: agency[], prodGroup, promoReg, salesmen[],
   managers[], custGroup[], majorOther, search
   --------------------------------------------------------------------- */
function applyFilters(rows, fs) {
  return rows.filter((r) => {
    if (fs.agency && fs.agency.length && !fs.agency.includes(r.agency)) return false;
    if (fs.prodGroup && fs.prodGroup !== "ALL" && normVal(r.prodGroup) !== normVal(fs.prodGroup)) return false;
    if (fs.promoReg && fs.promoReg !== "ALL" && r.promoReg !== fs.promoReg) return false;
    if (fs.salesmen && fs.salesmen.length && !fs.salesmen.includes(r.collector)) return false;
    if (fs.managers && fs.managers.length && !fs.managers.includes(r.managers)) return false;
    if (fs.custGroup && fs.custGroup.length && !fs.custGroup.includes(r.custGroup)) return false;
    if (fs.majorOther && fs.majorOther !== "ALL" && normVal(r.group) !== normVal(fs.majorOther)) return false;
    if (fs.search && fs.search.trim()) {
      const q = normVal(fs.search);
      const hay = normVal(r.custCode) + "|" + normVal(r.itemCode) + "|" + normVal(r.itemDesc) + "|" +
                  normVal(r.custSite) + "|" + normVal(r.agency) + "|" + normVal(r.brand) + "|" + normVal(r.subCat);
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

/* ---------------------------------------------------------------------
   7. METRIC COMPUTATION (SALES side — small dataset, computed in the browser)

   The SALES sheet's TYPE column has three values: PURCHASE, RETURN, and
   TARGET. Confirmed against the real sheet (matching a salesman's known-
   correct Achievement and Return totals from the user's own reference
   tool) that TARGET-type rows are real transactions too — NOT noise to
   exclude — so every "achieved distribution" / "last supply" calculation
   below treats PURCHASE and TARGET rows the same way, and only RETURN
   rows are excluded (per the original spec: distribution must exclude
   returns). The `purchase` bucket below is really "everything that isn't
   a return."
   --------------------------------------------------------------------- */
function splitSalesRows(salesRows) {
  const purchase = []; // PURCHASE + TARGET rows: real, distribution-eligible transactions
  const ret = [];       // RETURN rows only
  for (const r of salesRows) {
    if (r.type === "return") ret.push(r);
    else purchase.push(r);
  }
  return { purchase, ret };
}

function sum(rows, field) {
  let t = 0;
  for (const r of rows) t += r[field];
  return t;
}

function lastSaleDate(salesRows) {
  let max = null;
  for (const r of salesRows) {
    if (r.lastDate && (max === null || r.lastDate > max)) max = r.lastDate;
  }
  return max;
}
function lastSupplyDate(salesRows) {
  const { purchase } = splitSalesRows(salesRows);
  return lastSaleDate(purchase);
}

const KEY_SKU = (r) => r.itemCode;
const KEY_OUTLET = (r) => r.custCode;

/* Group an array of rows by a field, returning Map<value, rows[]> */
function groupBy(rows, field) {
  const m = new Map();
  for (const r of rows) {
    const k = r[field];
    if (!m.has(k)) m.set(k, []);
    m.get(k).push(r);
  }
  return m;
}

/* Achievement = the Sales column's own value summed across BOTH purchase
   and return rows together — no separate purchase/return split, and no
   subtracting one from the other. (Per explicit instruction: return
   rows already carry the correct signed Sales value in the source
   sheet, so a plain sum nets them out correctly on its own; splitting
   and subtracting was actively wrong and is no longer done anywhere.) */
function netAchSum(salesSlice) {
  return sum(salesSlice, "sales");
}
/* Return column is still shown on its own for visibility (per the
   original spec: "still display return values in every table") — this
   is display-only and has no effect on the achievement figure above.
   Uses the sheet's own dedicated "Return Val" column summed across ALL
   rows in scope (not just TYPE=RETURN rows) — confirmed against the real
   sheet that TYPE=TARGET rows also carry a real, nonzero Return Val that
   the user's own reference total includes; summing Return Val everywhere
   naturally comes out to 0 for rows that have no return component. */
function returnDisplaySum(salesSlice) {
  return Math.abs(sum(salesSlice, "returnVal"));
}

/* Build one display row by combining a pre-aggregated TARGET-side result
   (fetched from Google's servers: {target, distTarget}) with a slice of
   the (small, already-fetched) SALES rows for the same group. */
function mergeRow(label, targetAgg, salesSlice, distKeyFn) {
  const { purchase } = splitSalesRows(salesSlice);
  const net = netAchSum(salesSlice);
  const returnSum = returnDisplaySum(salesSlice);
  const target = targetAgg ? targetAgg.target : 0;
  const distTarget = targetAgg ? targetAgg.distTarget : 0;
  const btg = target - net;
  const achPct = target > 0 ? (net / target) * 100 : (net > 0 ? 100 : 0);
  // Distribution stays PURCHASE-only (excluding returns), per the original spec.
  const achSet = new Set();
  purchase.forEach((r) => { if (r.sales > 0) achSet.add(distKeyFn(r)); });
  const distAch = achSet.size;
  const distPct = distTarget > 0 ? (distAch / distTarget) * 100 : 0;
  return {
    label, target, return: returnSum, net, btg, achPct,
    distTarget, distAch, distPct,
    lastSale: lastSaleDate(salesSlice),
    lastSupply: lastSupplyDate(salesSlice),
  };
}

/* ---------------------------------------------------------------------
   8. TARGET-SIDE AGGREGATION (Google Query Language, runs server-side)

   distTarget/distAch "distribution" counts rely on one assumption: the
   TARGET sheet has exactly one row per (salesman, SKU, outlet) —
   i.e. no duplicate rows for the same combination. Under that assumption
   COUNT(anyColumn) after GROUP BY correctly gives a distinct-combination
   count without needing SQL's unavailable COUNT(DISTINCT ...).
   --------------------------------------------------------------------- */

/* Single aggregate (no grouping): {target, distTarget} for one WHERE scope. */
function targetOverallAgg(sheetId, colMap, whereClause) {
  const salesId = colId(colMap, ["Sales"]);
  const w = andJoin(whereClause, `${salesId} > 0`);
  const q = `select sum(${salesId}), count(${salesId})${whereSuffix(w)}`;
  return runGvizQuery(sheetId, q).then((dt) => {
    if (!dt.getNumberOfRows()) return { target: 0, distTarget: 0 };
    return { target: dt.getValue(0, 0) || 0, distTarget: dt.getValue(0, 1) || 0 };
  });
}

/* Grouped aggregate: target sum per distinct value of `groupField`.
   Returns Map<key, {target}> (row-count/"distTarget" added separately
   via targetDistinctSecondary since a single-level GROUP BY overcounts
   distribution — many outlets can share one agency, for example). */
function targetGroupSum(sheetId, colMap, groupField, whereClause, opts) {
  opts = opts || {};
  const gId = colId(colMap, [groupField]);
  const salesId = colId(colMap, ["Sales"]);
  const w = andJoin(whereClause, `${salesId} > 0`);
  let q = `select ${gId}, sum(${salesId})${whereSuffix(w)} group by ${gId} order by sum(${salesId}) desc`;
  if (opts.limit) q += ` limit ${opts.limit}`;
  return runGvizQuery(sheetId, q).then((dt) => {
    const map = new Map();
    for (let r = 0; r < dt.getNumberOfRows(); r++) {
      map.set(String(dt.getValue(r, 0)), { target: dt.getValue(r, 1) || 0 });
    }
    return map;
  });
}

/* Same as targetGroupSum, but also pulls a human-readable label column
   (e.g. "Cust Site" name for a "Cust Site Code" grouping, or "Item Desc"
   for an "Item Code" grouping) straight from the TARGET sheet itself —
   not from the small SALES rows, which only cover outlets/SKUs with an
   actual transaction this month. That mismatch was exactly why the
   Outlet/SKU columns sometimes showed a code and sometimes a name: an
   outlet with zero sales this month has no SALES row to pull a name
   from. Pulling the label from TARGET (which has one row per every
   outlet/SKU regardless of whether it sold anything) means every row
   gets a consistent, real label. Assumes one code maps to one label. */
function targetGroupSumWithLabel(sheetId, colMap, groupField, labelField, whereClause, opts) {
  opts = opts || {};
  const gId = colId(colMap, [groupField]);
  const lId = colId(colMap, [labelField]);
  const salesId = colId(colMap, ["Sales"]);
  const w = andJoin(whereClause, `${salesId} > 0`);
  let q = `select ${gId}, ${lId}, sum(${salesId})${whereSuffix(w)} group by ${gId}, ${lId} order by sum(${salesId}) desc`;
  if (opts.limit) q += ` limit ${opts.limit}`;
  return runGvizQuery(sheetId, q).then((dt) => {
    const map = new Map();
    for (let r = 0; r < dt.getNumberOfRows(); r++) {
      const key = String(dt.getValue(r, 0));
      const rawLabel = dt.getValue(r, 1);
      const label = (rawLabel != null && String(rawLabel).trim() !== "") ? String(rawLabel).trim() : key;
      map.set(key, { target: dt.getValue(r, 2) || 0, label });
    }
    return map;
  });
}

/* Two-level GROUP BY (primaryField, secondaryField), tallied client-side
   into Map<primaryValue, distinctSecondaryCount>. Result size is bounded
   by (#distinct primary values * #distinct secondary values), which stays
   small even though the underlying sheet has hundreds of thousands of rows. */
function targetDistinctSecondary(sheetId, colMap, primaryField, secondaryField, whereClause, restrictToKeys) {
  const pId = colId(colMap, [primaryField]);
  const sId = colId(colMap, [secondaryField]);
  const salesId = colId(colMap, ["Sales"]);
  const restrictClause = (restrictToKeys && restrictToKeys.length) ? eqAnyNumericSafe(pId, restrictToKeys) : null;
  const w = andJoin(whereClause, `${salesId} > 0`, restrictClause);
  // Google's query engine rejects a GROUP BY with no aggregate function at
  // all (CANNOT_GROUP_WITHOUT_AGG) even when every selected column is a
  // group key — so a harmless count(...) is added and simply ignored.
  const q = `select ${pId}, ${sId}, count(${sId})${whereSuffix(w)} group by ${pId}, ${sId}`;
  return runGvizQuery(sheetId, q).then((dt) => {
    const map = new Map();
    for (let r = 0; r < dt.getNumberOfRows(); r++) {
      const k = String(dt.getValue(r, 0));
      map.set(k, (map.get(k) || 0) + 1);
    }
    return map;
  });
}

/* Total count of distinct (field1, field2) pairs within a WHERE scope —
   used for the Overall KPI card's distribution denominator. Doesn't rely
   on the "one row per combo" shortcut the single-column COUNT() does,
   because the same SKU can legitimately appear at the same outlet under
   more than one agency/row. */
function targetDistinctPairCount(sheetId, colMap, field1, field2, whereClause) {
  const id1 = colId(colMap, [field1]);
  const id2 = colId(colMap, [field2]);
  const salesId = colId(colMap, ["Sales"]);
  const w = andJoin(whereClause, `${salesId} > 0`);
  const q = `select ${id1}, ${id2}, count(${id2})${whereSuffix(w)} group by ${id1}, ${id2}`; // see note above re: CANNOT_GROUP_WITHOUT_AGG
  return runGvizQuery(sheetId, q).then((dt) => dt.getNumberOfRows());
}

/* Count of distinct values of a single column within a WHERE scope
   (restricted to rows with a positive target, same as the other
   target-side aggregates). "Distribution" throughout this dashboard
   means distinct OUTLET coverage (per explicit request), so this is
   used with field="Cust Site Code" for every aggregate-level table
   (Overall / Agency / Promo). Per-row tables (Top Customers, Top SKUs)
   use targetDistinctSecondary instead, since their distribution is
   naturally the *other* dimension (SKUs-per-outlet / outlets-per-SKU). */
function targetDistinctCount(sheetId, colMap, field, whereClause) {
  const id = colId(colMap, [field]);
  const salesId = colId(colMap, ["Sales"]);
  const w = andJoin(whereClause, `${salesId} > 0`);
  const q = `select ${id}, count(${id})${whereSuffix(w)} group by ${id}`; // see note above re: CANNOT_GROUP_WITHOUT_AGG
  return runGvizQuery(sheetId, q).then((dt) => dt.getNumberOfRows());
}

/* Distinct values of one column within a WHERE scope — used to populate
   filter dropdown options without pulling any raw target rows. */
function targetDistinctValues(sheetId, colMap, field, whereClause) {
  const id = colId(colMap, [field]);
  const q = `select ${id}, count(${id})${whereSuffix(whereClause)} group by ${id} order by ${id}`; // see note above re: CANNOT_GROUP_WITHOUT_AGG
  return runGvizQuery(sheetId, q).then((dt) => {
    const vals = [];
    for (let r = 0; r < dt.getNumberOfRows(); r++) {
      const v = dt.getValue(r, 0);
      if (v !== null && v !== "") vals.push(String(v));
    }
    return vals;
  });
}

/* ---------------------------------------------------------------------
   9. SUMMARY PAGE DATA BUILDER (async — issues several small GQL queries
   against the TARGET sheet, merges each with the already-fetched SALES
   rows for the same scope).
   --------------------------------------------------------------------- */
async function buildSummaryData(targetSheetId, targetColMap, whereT, salesRowsScoped, user) {
  const out = {};

  // Overall KPIs. "Distribution" = distinct OUTLET coverage (not SKU, and
  // not SKU×outlet pairs — per explicit instruction), Achievement = the
  // Sales column summed across purchase+return together (see netAchSum).
  const [overallAgg, overallDistTarget] = await Promise.all([
    targetOverallAgg(targetSheetId, targetColMap, whereT),
    targetDistinctCount(targetSheetId, targetColMap, "Cust Site Code", whereT),
  ]);
  const { purchase } = splitSalesRows(salesRowsScoped);
  const net = netAchSum(salesRowsScoped);
  const returnSum = returnDisplaySum(salesRowsScoped);
  const achSetOverall = new Set();
  purchase.forEach((r) => { if (r.sales > 0) achSetOverall.add(r.custCode); }); // distinct outlets achieved
  out.overall = {
    target: overallAgg.target, return: returnSum, net,
    btg: overallAgg.target - net,
    achPct: overallAgg.target > 0 ? (net / overallAgg.target) * 100 : (net > 0 ? 100 : 0),
    distTarget: overallDistTarget, distAch: achSetOverall.size,
    distPct: overallDistTarget > 0 ? (achSetOverall.size / overallDistTarget) * 100 : 0,
  };

  // Agency-wise — distribution = distinct outlets within each agency.
  const [agencySumMap, agencyDistMap] = await Promise.all([
    targetGroupSum(targetSheetId, targetColMap, "Agency", whereT),
    targetDistinctSecondary(targetSheetId, targetColMap, "Agency", "Cust Site Code", whereT),
  ]);
  const sByAgency = groupBy(salesRowsScoped, "agency");
  const agencyKeys = new Set([...agencySumMap.keys(), ...sByAgency.keys()]);
  out.byAgency = [...agencyKeys].filter(Boolean).map((a) =>
    mergeRow(a, { target: (agencySumMap.get(a) || {}).target || 0, distTarget: agencyDistMap.get(a) || 0 }, sByAgency.get(a) || [], KEY_OUTLET)
  ).sort((x, y) => y.target - x.target);

  // Promo / Regular — distribution = distinct outlets within each type.
  const [promoSumMap, promoDistMap] = await Promise.all([
    targetGroupSum(targetSheetId, targetColMap, "Promo_Regular ?", whereT),
    targetDistinctSecondary(targetSheetId, targetColMap, "Promo_Regular ?", "Cust Site Code", whereT),
  ]);
  const sByPromo = groupBy(salesRowsScoped, "promoReg");
  const promoKeys = new Set([...promoSumMap.keys(), ...sByPromo.keys()]);
  out.byPromo = [...promoKeys].filter(Boolean).map((p) =>
    mergeRow(p, { target: (promoSumMap.get(p) || {}).target || 0, distTarget: promoDistMap.get(p) || 0 }, sByPromo.get(p) || [], KEY_OUTLET)
  ).sort((x, y) => y.target - x.target);

  // Top 10 Customers by target — each row IS one outlet, so its own
  // distribution naturally means SKU coverage at that outlet. Label is
  // always the outlet's Cust Site NAME (never the code), pulled from the
  // TARGET sheet so it's there even for an outlet with zero sales.
  const custSumMap = await targetGroupSumWithLabel(targetSheetId, targetColMap, "Cust Site Code", "Cust Site", whereT, { limit: 10 });
  const topCustCodes = [...custSumMap.keys()];
  const custDistMap = await targetDistinctSecondary(targetSheetId, targetColMap, "Cust Site Code", "Item Code", whereT, topCustCodes);
  const sByCust = groupBy(salesRowsScoped, "custCode");
  out.topCustomers = topCustCodes.map((code) =>
    mergeRow(custSumMap.get(code).label, { target: custSumMap.get(code).target, distTarget: custDistMap.get(code) || 0 }, sByCust.get(code) || [], KEY_SKU)
  );

  // Top 20 SKUs by target — each row IS one SKU, so its own distribution
  // naturally means outlet coverage for that SKU. Label is always the
  // Item DESCRIPTION (never the code), same reasoning as above.
  const skuSumMap = await targetGroupSumWithLabel(targetSheetId, targetColMap, "Item Code", "Item Desc", whereT, { limit: 20 });
  const topSkuCodes = [...skuSumMap.keys()];
  const skuDistMap = await targetDistinctSecondary(targetSheetId, targetColMap, "Item Code", "Cust Site Code", whereT, topSkuCodes);
  const sBySku = groupBy(salesRowsScoped, "itemCode");
  out.topSkus = topSkuCodes.map((code) =>
    mergeRow(skuSumMap.get(code).label, { target: skuSumMap.get(code).target, distTarget: skuDistMap.get(code) || 0 }, sBySku.get(code) || [], KEY_OUTLET)
  );

  // Manager / GM / BDM / TME only: salesmen breakdown table (already kept
  // outlet and SKU distribution as two clearly separate column groups).
  if (user.title === "MANAGER" || FULL_ACCESS_TITLES.includes(user.title)) {
    const [salesmanSumMap, salesmanOutletDistMap, salesmanSkuDistMap] = await Promise.all([
      targetGroupSum(targetSheetId, targetColMap, "Collector", whereT),
      targetDistinctSecondary(targetSheetId, targetColMap, "Collector", "Cust Site Code", whereT),
      targetDistinctSecondary(targetSheetId, targetColMap, "Collector", "Item Code", whereT),
    ]);
    const sBySales = groupBy(salesRowsScoped, "collector");
    const salesmenKeys = new Set([...salesmanSumMap.keys(), ...sBySales.keys()]);
    out.bySalesman = [...salesmenKeys].filter(Boolean).map((sName) => {
      const sSlice = sBySales.get(sName) || [];
      const { purchase: p2 } = splitSalesRows(sSlice);
      const net2 = netAchSum(sSlice);
      const returnSum2 = returnDisplaySum(sSlice);
      const target2 = (salesmanSumMap.get(sName) || {}).target || 0;
      const distOutletTarget = salesmanOutletDistMap.get(sName) || 0;
      const distSkuTarget = salesmanSkuDistMap.get(sName) || 0;
      const achOutletSet = new Set(); const achSkuSet = new Set();
      p2.forEach((r) => { if (r.sales > 0) { achOutletSet.add(r.custCode); achSkuSet.add(r.itemCode); } });
      return {
        label: sName, target: target2, return: returnSum2, net: net2,
        btg: target2 - net2, achPct: target2 > 0 ? (net2 / target2) * 100 : (net2 > 0 ? 100 : 0),
        distOutlet: { distTarget: distOutletTarget, distAch: achOutletSet.size, distPct: distOutletTarget > 0 ? (achOutletSet.size / distOutletTarget) * 100 : 0 },
        distSku: { distTarget: distSkuTarget, distAch: achSkuSet.size, distPct: distSkuTarget > 0 ? (achSkuSet.size / distSkuTarget) * 100 : 0 },
      };
    }).sort((a, b) => b.target - a.target);
  }

  return out;
}

/* ---------------------------------------------------------------------
   9b. "AGENCY FOCUS" PAGE DATA BUILDER — reuses buildSummaryData wholesale
   (same KPIs / Promo-Regular / Top Customers / Top SKUs / Salesmen-wise
   tables an assigned TME already trusts), just with the WHERE clause and
   the sales-rows slice both additionally locked to one Agency, on top of
   whatever role scope + non-Agency filters already apply. Deliberately
   ignores the app's own Agency filter (the caller passes a whereBase/
   salesRowsScoped already built with filters.agency cleared) so a
   leftover Agency selection from another page can never silently zero
   out this page's results.
   --------------------------------------------------------------------- */
async function buildAgencyFocusData(targetSheetId, targetColMap, whereBase, agencyName, salesRowsScoped, user) {
  const agencyId = colId(targetColMap, ["Agency"]);
  const whereT = andJoin(whereBase, eqAny(agencyId, [agencyName]));
  const scopedSalesRows = salesRowsScoped.filter((r) => r.agency === agencyName);
  const [summary, outlets, skus] = await Promise.all([
    buildSummaryData(targetSheetId, targetColMap, whereT, scopedSalesRows, user),
    buildAgencyFocusOutletsData(targetSheetId, targetColMap, whereT, scopedSalesRows),
    buildSkusData(targetSheetId, targetColMap, whereT, scopedSalesRows),
  ]);
  // Unlike the whole-company Summary page (Top 10 Customers / Top 20
  // SKUs), Agency Focus shows the FULL outlet/SKU list for this one
  // locked agency — the same unlimited builders the Outlets/0 Billing
  // pages already use, just re-run here scoped to this agency.
  summary.allOutlets = outlets.rows;
  summary.allSkus = skus.rows;
  return summary;
}

/* ---------------------------------------------------------------------
   10. "ALL CUSTOMERS / OUTLETS" PAGE DATA BUILDER
   Same shape/columns as the Summary page's "Top Customers" table, just
   with no limit — every outlet in the current role+filter scope, not
   just the top 10. Deliberately a separate, on-demand function (not
   folded into buildSummaryData) so visiting this page never adds extra
   Google Sheets queries to the normal Summary page load.

   IMPORTANT — no restrictToKeys here, unlike the Summary page's top-10/
   top-20 lists: those pass their (small, capped) code list into
   targetDistinctSecondary as an extra WHERE restriction purely as a
   server-side performance shortcut. Here the list is EVERY code in
   scope — restricting to it adds nothing (both queries already share
   the identical whereT + "Sales > 0" filter, so the distinct-code set
   targetDistinctSecondary naturally returns is already exactly
   `allCodes`) but the resulting WHERE clause grows with the number of
   outlets, which for a manager's whole team or a GM's whole company can
   run into the hundreds — long enough to blow past the browser's URL
   length limit and make the <script src="..."> request itself fail
   ("script failed to load"), confirmed as the real cause of 0 Billing/
   Outlet Details erroring out for manager- and full-access-tier users.
   Salesman-tier scope stayed small enough to never hit this.
   --------------------------------------------------------------------- */
async function buildOutletsData(targetSheetId, targetColMap, whereT, salesRowsScoped) {
  const custSumMap = await targetGroupSumWithLabel(targetSheetId, targetColMap, "Cust Site Code", "Cust Site", whereT, {});
  const allCodes = [...custSumMap.keys()];
  const custDistMap = await targetDistinctSecondary(targetSheetId, targetColMap, "Cust Site Code", "Item Code", whereT);
  const sByCust = groupBy(salesRowsScoped, "custCode");
  const rows = allCodes.map((code) => {
    const row = mergeRow(custSumMap.get(code).label, { target: custSumMap.get(code).target, distTarget: custDistMap.get(code) || 0 }, sByCust.get(code) || [], KEY_SKU);
    row._custCode = code; // kept so the UI can fetch this one outlet's agency breakdown on demand (the "+" expand button)
    return row;
  });
  return { rows };
}

/* On-demand agency breakdown for a single outlet — one small GQL query,
   fired only when a user actually expands that outlet's "+" button (never
   prefetched for every outlet, to avoid piling extra queries onto a page
   that can already have hundreds of rows). No distribution columns here
   (they don't mean much scoped to one outlet) — just Target/Achievement/
   Return/BTG/Ach%, same as every other agency-wise breakdown in the app. */
async function buildOutletAgencyBreakdown(targetSheetId, targetColMap, whereBase, custCode, salesRowsScoped) {
  const custId = colId(targetColMap, ["Cust Site Code"]);
  const scopedWhere = andJoin(whereBase, eqAnyNumericSafe(custId, [custCode]));
  const agencySumMap = await targetGroupSum(targetSheetId, targetColMap, "Agency", scopedWhere);
  const outletSalesRows = salesRowsScoped.filter((r) => r.custCode === custCode);
  const sByAgency = groupBy(outletSalesRows, "agency");
  const agencyKeys = new Set([...agencySumMap.keys(), ...sByAgency.keys()]);
  return [...agencyKeys].filter(Boolean).map((a) =>
    mergeRow(a, { target: (agencySumMap.get(a) || {}).target || 0, distTarget: 0 }, sByAgency.get(a) || [], KEY_SKU)
  ).sort((x, y) => y.target - x.target);
}

/* On-demand SKU breakdown for one AGENCY at one OUTLET — used by the
   Outlet Details page's "+" expand (agency -> SKU-wise). Scoped by both
   Cust Site Code AND Agency together. lastSupply on each returned row
   (from mergeRow) is exactly "last date this SKU was supplied to this
   outlet under this agency, this month" — null if never this month,
   which the UI uses to highlight the row red. */
async function buildOutletAgencySkuBreakdown(targetSheetId, targetColMap, whereBase, custCode, agencyName, salesRowsScoped) {
  const custId = colId(targetColMap, ["Cust Site Code"]);
  const agencyId = colId(targetColMap, ["Agency"]);
  const scopedWhere = andJoin(whereBase, eqAnyNumericSafe(custId, [custCode]), eqAny(agencyId, [agencyName]));
  const skuSumMap = await targetGroupSumWithLabel(targetSheetId, targetColMap, "Item Code", "Item Desc", scopedWhere, {});
  const outletAgencySalesRows = salesRowsScoped.filter((r) => r.custCode === custCode && r.agency === agencyName);
  const sBySku = groupBy(outletAgencySalesRows, "itemCode");
  const skuKeys = new Set([...skuSumMap.keys(), ...sBySku.keys()]);
  return [...skuKeys].filter(Boolean).map((code) => {
    const info = skuSumMap.get(code);
    const slice = sBySku.get(code) || [];
    const label = info ? info.label : ((slice[0] && slice[0].itemDesc) || code);
    return mergeRow(label, { target: info ? info.target : 0, distTarget: 0 }, slice, KEY_OUTLET);
  }).sort((x, y) => y.target - x.target);
}

/* On-demand "every target-bearing SKU at one OUTLET, across ALL
   agencies" breakdown — same row shape as buildOutletAgencySkuBreakdown
   (via mergeRow, so it carries lastSupply too) but scoped only by Cust
   Site Code, with no Agency filter. Used by the "All Customers / Outlets"
   page's second "+" (embedded in the SKU Dist Target column) to show
   exactly which of that outlet's target SKUs have not been supplied
   there this month — the caller filters the returned rows down to
   lastSupply === null, which by construction comes out to exactly
   (SKU Dist Target - SKU Dist Ach) on that outlet's row, since distTarget/
   distAch there are computed from this same Cust Site Code scope. */
async function buildOutletSkuBreakdown(targetSheetId, targetColMap, whereBase, custCode, salesRowsScoped) {
  const custId = colId(targetColMap, ["Cust Site Code"]);
  const scopedWhere = andJoin(whereBase, eqAnyNumericSafe(custId, [custCode]));
  const skuSumMap = await targetGroupSumWithLabel(targetSheetId, targetColMap, "Item Code", "Item Desc", scopedWhere, {});
  const outletSalesRows = salesRowsScoped.filter((r) => r.custCode === custCode);
  const sBySku = groupBy(outletSalesRows, "itemCode");
  const skuKeys = new Set([...skuSumMap.keys(), ...sBySku.keys()]);
  return [...skuKeys].filter(Boolean).map((code) => {
    const info = skuSumMap.get(code);
    const slice = sBySku.get(code) || [];
    const label = info ? info.label : ((slice[0] && slice[0].itemDesc) || code);
    return mergeRow(label, { target: info ? info.target : 0, distTarget: 0 }, slice, KEY_OUTLET);
  }).sort((x, y) => y.target - x.target);
}

/* On-demand "every target-bearing OUTLET for one SKU, within the current
   scope" breakdown — the mirror image of buildOutletSkuBreakdown (SKU per
   outlet vs. here, outlet per SKU). Used by the Agency Focus page's SKU
   table: its second "+" (embedded in the Outlet Dist Target column) shows
   exactly which outlets carrying a target for that one SKU have not been
   supplied it yet this month. */
async function buildSkuOutletBreakdown(targetSheetId, targetColMap, whereBase, itemCode, salesRowsScoped) {
  const itemId = colId(targetColMap, ["Item Code"]);
  const scopedWhere = andJoin(whereBase, eqAnyNumericSafe(itemId, [itemCode]));
  const custSumMap = await targetGroupSumWithLabel(targetSheetId, targetColMap, "Cust Site Code", "Cust Site", scopedWhere, {});
  const skuSalesRows = salesRowsScoped.filter((r) => r.itemCode === itemCode);
  const sByCust = groupBy(skuSalesRows, "custCode");
  const custKeys = new Set([...custSumMap.keys(), ...sByCust.keys()]);
  return [...custKeys].filter(Boolean).map((code) => {
    const info = custSumMap.get(code);
    const slice = sByCust.get(code) || [];
    const label = info ? info.label : ((slice[0] && slice[0].custSite) || code);
    return mergeRow(label, { target: info ? info.target : 0, distTarget: 0 }, slice, KEY_SKU);
  }).sort((x, y) => y.target - x.target);
}

/* On-demand "every target-bearing OUTLET for one Promo/Regular type,
   within the current scope" breakdown — same shape again, scoped by the
   Promo_Regular field instead of a single outlet or SKU. Used by the
   Agency Focus page's Promo/Regular table: its second "+" (embedded in
   the Outlet Dist Target column) shows which outlets carrying a target
   under that promo/regular type at this agency have not been supplied
   anything there yet this month. */
async function buildPromoOutletBreakdown(targetSheetId, targetColMap, whereBase, promoRegValue, salesRowsScoped) {
  const promoId = colId(targetColMap, ["Promo_Regular ?"]);

  const promoSalesRows = salesRowsScoped.filter((r) => r.promoReg === promoRegValue);
  const sByCust = groupBy(promoSalesRows, "custCode");
  const custKeys = new Set([...custSumMap.keys(), ...sByCust.keys()]);
  return [...custKeys].filter(Boolean).map((code) => {
    const info = custSumMap.get(code);
    const slice = sByCust.get(code) || [];
    const label = info ? info.label : ((slice[0] && slice[0].custSite) || code);
    return mergeRow(label, { target: info ? info.target : 0, distTarget: 0 }, slice, KEY_SKU);
  }).sort((x, y) => y.target - x.target);
}

/* Agency Focus page's own outlet list — reuses buildOutletsData wholesale
   (unlimited, same as the main Outlets page) then attaches which salesman
   ("Collector") covers each outlet, pulled from the TARGET sheet the same
   way the outlet's own name is (one extra small query, fired in parallel).
   Assumes one salesman per outlet within this one locked agency, same
   "one label per group" assumption targetGroupSumWithLabel already makes
   for the outlet's own name. */
async function buildAgencyFocusOutletsData(targetSheetId, targetColMap, whereT, salesRowsScoped) {
  const [outletsResult, salesmanMap] = await Promise.all([
    buildOutletsData(targetSheetId, targetColMap, whereT, salesRowsScoped),
    targetGroupSumWithLabel(targetSheetId, targetColMap, "Cust Site Code", "Collector", whereT, {}),
  ]);
  outletsResult.rows.forEach((row) => {
    const info = salesmanMap.get(row._custCode);
    row.salesman = info ? info.label : "";
  });
  return outletsResult;
}

/* ---------------------------------------------------------------------
   11. "YESTERDAY'S SALES" PAGE — a fixed, always-previous-calendar-day
   breakdown (agency-wise / SKU-wise / outlet-wise, with returns), built
   entirely from already-known SALES rows (no TARGET/GQL queries at all,
   since a single day has no monthly target to compare against — this is
   a plain activity report, not an achievement-vs-target one). Ignores
   the app's Agency/Product Group/etc. filters by design: it's meant to
   always show a salesman's whole previous day, not a filtered slice.
   --------------------------------------------------------------------- */
function computeYesterdayKey(refDate) {
  const now = refDate || new Date();
  const y = new Date(now.getFullYear(), now.getMonth(), now.getDate() - 1);
  const yr = y.getFullYear(), month1based = y.getMonth() + 1, day = y.getDate();
  const monthKey = yr + "-" + String(month1based).padStart(2, "0");
  const dateKey = yr * 10000 + month1based * 100 + day;
  return { yr, month1based, day, monthKey, dateKey, label: dateKeyToLabel(dateKey) };
}

/* Generic "group these already-fetched rows by one field" used both for
   Yesterday's three top-level tables AND for the on-demand SKU breakdown
   when a user expands one outlet row — that expansion is just this same
   function re-run against a pre-filtered slice of the same day's rows, so
   it's instant (no network call) unlike the Outlets page's expand, which
   needs a GQL query since Target figures only live in the big TARGET sheet.
   `_key` keeps the raw grouping value (custCode / itemCode / agency name)
   so the UI can scope a drill-down without re-deriving it from the label. */
function groupSalesRowsBy(rows, field, labelField) {
  const groups = groupBy(rows, field);
  const out = [];
  groups.forEach((rs, key) => {
    if (!key) return;
    out.push({
      label: (rs[0] && rs[0][labelField]) || key,
      _key: key,
      net: netAchSum(rs),
      return: returnDisplaySum(rs),
      outlets: new Set(rs.map((r) => r.custCode)).size,
      skus: new Set(rs.map((r) => r.itemCode)).size,
    });
  });
  return out.sort((a, b) => b.net - a.net);
}

function buildYesterdaySummary(dayRows) {
  const totals = {
    net: netAchSum(dayRows),
    return: returnDisplaySum(dayRows),
    outletsBilled: new Set(dayRows.filter((r) => r.sales > 0).map((r) => r.custCode)).size,
    skusSold: new Set(dayRows.filter((r) => r.sales > 0).map((r) => r.itemCode)).size,
  };

  return {
    totals,
    dayRows, // kept so the UI can compute a per-outlet SKU breakdown on demand, with no re-fetch
    byOutlet: groupSalesRowsBy(dayRows, "custCode", "custSite"),
    byAgency: groupSalesRowsBy(dayRows, "agency", "agency"),
    bySku: groupSalesRowsBy(dayRows, "itemCode", "itemDesc"),
  };
}

/* ---------------------------------------------------------------------
   12. "0 BILLING" PAGE DATA BUILDERS

   Two lists, both scoped by the current role + filters:
   (a) outlets that carry a target but zero (or negative, thanks to a
       return) net sales this month — buildOutletsData already gives the
       full unlimited outlet list with `target`/`net` on every row, so
       this is a pure client-side filter of that, no new query needed;
   (b) SKUs that carry a target but were sold at NONE of this user's
       outlets this month — needs a SKU-level equivalent of
       buildOutletsData (unlimited, mirroring the Summary page's "Top
       20 SKUs" query but with no limit), added here as buildSkusData.
   Both tables only ever show Target (per explicit spec — no
   Achievement/Return/etc. columns), so no other field is computed here.
   --------------------------------------------------------------------- */
async function buildSkusData(targetSheetId, targetColMap, whereT, salesRowsScoped) {
  const skuSumMap = await targetGroupSumWithLabel(targetSheetId, targetColMap, "Item Code", "Item Desc", whereT, {});
  const allCodes = [...skuSumMap.keys()];
  // IMPORTANT — no restrictToKeys here, same reasoning as buildOutletsData
  // above: allCodes is EVERY code already in scope for whereT, so it adds
  // nothing as a restriction (targetDistinctSecondary's own distinct-code
  // set is already exactly allCodes) but its OR-chain length grows with
  // team/company size and can blow past the browser's URL length limit for
  // manager/GM-tier scope, causing the gviz <script src> request itself to
  // fail to load. See buildOutletsData's comment for the full writeup.
  const skuDistMap = await targetDistinctSecondary(targetSheetId, targetColMap, "Item Code", "Cust Site Code", whereT);
  const sBySku = groupBy(salesRowsScoped, "itemCode");
  const rows = allCodes.map((code) => {
    const row = mergeRow(skuSumMap.get(code).label, { target: skuSumMap.get(code).target, distTarget: skuDistMap.get(code) || 0 }, sBySku.get(code) || [], KEY_OUTLET);
    row._itemCode = code;
    return row;
  });
  return { rows };
}

/* Pure client-side filter of two already-fetched (full, unlimited)
   outlet/SKU lists down to the "0 billing" condition: target > 0 and
   net <= 0. Using <= 0 (not === 0) deliberately covers the outlet case
   explicitly called out — a return against an earlier month's purchase
   can push net negative with zero real sales this month, and that
   outlet should still show up here, not be hidden by a stricter ===0 check. */
function buildZeroBillingData(outletsRows, skuRows) {
  const zeroOutlets = outletsRows.filter((r) => r.target > 0 && r.net <= 0);
  const zeroSkus = skuRows.filter((r) => r.target > 0 && r.net <= 0);
  return {
    outlets: zeroOutlets,
    outletsTotalTarget: sum(zeroOutlets, "target"),
    skus: zeroSkus,
    skusTotalTarget: sum(zeroSkus, "target"),
  };
}

function $(sel, root) { return (root || document).querySelector(sel); }
function el(tag, attrs, children) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === "class") e.className = attrs[k];
    else if (k === "html") e.innerHTML = attrs[k];
    else if (k.startsWith("on") && typeof attrs[k] === "function") e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (children || []).forEach((c) => { if (c != null) e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return e;
}

/* ---------------------------------------------------------------------
   THEME (light / dark) — default is light (no attribute at all); a
   choice is remembered in localStorage so it sticks across visits on
   the same device. A tiny inline script in <head> (see index.html)
   applies a remembered "dark" choice before first paint so there's no
   flash of light before switching over; everything below is just the
   toggle control + keeping every open toggle button's label in sync.
   --------------------------------------------------------------------- */
const THEME_KEY = "zbm_theme_v1";
function getTheme() {
  return document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
}
function applyTheme(theme) {
  if (theme === "dark") document.documentElement.setAttribute("data-theme", "dark");
  else document.documentElement.removeAttribute("data-theme");
}
function themeToggleLabel() {
  return getTheme() === "dark" ? "☀ Light" : "🌙 Dark";
}
function toggleTheme() {
  const next = getTheme() === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  document.querySelectorAll(".theme-toggle").forEach((btn) => { btn.textContent = themeToggleLabel(); });
}
function renderThemeToggleButton() {
  return el("button", { class: "theme-toggle", type: "button", title: "Switch between light and dark theme", onclick: toggleTheme }, [themeToggleLabel()]);
}

/* ---------------------------------------------------------------------
   DOWNLOAD TO EXCEL/CSV — every table gets its own "⬇ CSV" button
   (downloads exactly what's on screen, respecting the current sort),
   and every page gets one "Download Page" button that combines every
   table currently shown on that page (including the KPI cards) into a
   single CSV with a blank line between each table's section — opens
   straight into Excel like any other CSV. No server round-trip and no
   extra library: everything here runs in the browser via a Blob +
   temporary download link.
   --------------------------------------------------------------------- */
let pageTableRegistry = []; // reset at the top of every page render function, refilled by renderTable/renderExpandableTable/renderKpiCards as they run
function resetPageTableRegistry() { pageTableRegistry = []; }
function registerTableForDownload(title, columns, rows) {
  if (!columns || !rows) return;
  pageTableRegistry.push({ title: title || "Table", columns, rows });
}
function csvEscapeCell(v) {
  const s = v == null ? "" : String(v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function tableToCsvText(columns, rows) {
  const header = columns.map((c) => csvEscapeCell(c.label || c.key));
  const body = rows.map((r) => columns.map((c) => {
    const val = c.fmt ? c.fmt(r[c.key], r) : r[c.key];
    return csvEscapeCell(val);
  }).join(","));
  return [header.join(","), ...body].join("\r\n");
}
function safeFileNamePart(s) {
  return String(s || "table").replace(/[^a-z0-9]+/gi, "_").replace(/^_+|_+$/g, "").slice(0, 80) || "table";
}
function triggerCsvDownload(filename, csvBody) {
  // Leading BOM so Excel (Windows especially) opens the file as UTF-8
  // instead of guessing the wrong encoding and garbling any non-ASCII text.
  const blob = new Blob(["﻿" + csvBody], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = el("a", { href: url, download: filename });
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function downloadTableCSV(title, columns, rows) {
  const stamp = new Date().toISOString().slice(0, 10);
  triggerCsvDownload("ZBM_" + safeFileNamePart(title) + "_" + stamp + ".csv", tableToCsvText(columns, rows));
}
function downloadPageCSV(pageLabel) {
  if (!pageTableRegistry.length) return;
  const stamp = new Date().toISOString().slice(0, 10);
  const sections = pageTableRegistry.map((t) => t.title + "\r\n" + tableToCsvText(t.columns, t.rows));
  triggerCsvDownload("ZBM_" + safeFileNamePart(pageLabel) + "_" + stamp + ".csv", sections.join("\r\n\r\n"));
}
/* Appended right after a page's <h2 class="page-title"> once real table
   content is about to render (never shown on a bare loading/error
   screen, since there'd be nothing yet worth downloading). */
function renderPageDownloadToolbar(pageLabel) {
  const bar = el("div", { class: "page-toolbar" });
  const btn = el("button", { class: "btn-download-page", type: "button", title: "Download every table on this page as one Excel-ready CSV file" }, ["⬇ Download Page (Excel/CSV)"]);
  btn.addEventListener("click", () => downloadPageCSV(pageLabel));
  bar.appendChild(btn);
  return bar;
}

function renderLogin(errorMsg) {
  const root = $("#root");
  root.innerHTML = "";

  const salesmen = USERS.filter((u) => u.title === "SALES MEN");
  const managers = USERS.filter((u) => u.title === "MANAGER");
  const leadership = USERS.filter((u) => FULL_ACCESS_TITLES.includes(u.title));

  const select = el("select", { id: "loginUser", class: "input" }, [
    el("option", { value: "" }, ["Select your name..."]),
    el("optgroup", { label: "Salesmen" }, salesmen.map((u) => el("option", { value: u.username }, [u.username]))),
    el("optgroup", { label: "Managers" }, managers.map((u) => el("option", { value: u.username }, [u.username]))),
    el("optgroup", { label: "Leadership" }, leadership.map((u) => el("option", { value: u.username }, [u.username]))),
  ]);
  const pass = el("input", { id: "loginPass", class: "input", type: "password", placeholder: "Password", inputmode: "numeric" });

  const card = el("div", { class: "login-card" }, [
    el("div", { class: "login-title" }, ["ZBM Sales Dashboard"]),
    el("div", { class: "login-sub" }, ["Sign in with your username and password"]),
    errorMsg ? el("div", { class: "login-error" }, [errorMsg]) : null,
    el("label", { class: "field-label" }, ["Username"]),
    select,
    el("label", { class: "field-label" }, ["Password"]),
    pass,
    el("button", { class: "btn btn-primary btn-block", id: "loginBtn" }, ["Log In"]),
  ]);

  root.appendChild(el("div", { class: "login-wrap" }, [card]));
  root.appendChild(el("div", { style: "position:fixed;top:12px;right:12px;z-index:50;" }, [
    (() => { const b = renderThemeToggleButton(); b.style.background = "rgba(0,0,0,0.06)"; b.style.color = "var(--text)"; b.style.borderColor = "var(--border)"; return b; })(),
  ]));

  const doLogin = () => {
    const uname = select.value;
    const pwd = pass.value.trim();
    if (!uname) { renderLogin("Please select your name."); return; }
    const match = USERS.find((u) => u.username === uname && String(u.password) === pwd);
    if (!match) { renderLogin("Incorrect password. Please try again."); return; }
    state.user = match;
    renderAppShell();
    loadMonth(state.month);
  };
  $("#loginBtn").addEventListener("click", doLogin);
  pass.addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
}

  state.page = "summary";
  state.pageYesterday = null;

  state.pageAgencyFocus = { agency: null };

}

/* ---------------------------------------------------------------------
   DATA LOADING

   The TARGET sheet (200,000+ rows) is never pulled raw — see dashboard.js
   section 4. Here we only: (1) resolve each sheet's column-letter map,
   (2) pull the small SALES sheet as real rows (already scoped to this
   user's role + real transactions), and (3) pull small distinct-value
   lists to populate the filter dropdowns. The heavy per-table numbers
   are fetched on demand inside renderContent().
   --------------------------------------------------------------------- */
async function loadMonth(monthKey, silent) {
  const cfg = MONTHS.find((m) => m.key === monthKey);
  if (!cfg) return;
  if (!silent) { state.loading = true; state.error = null; renderApp(); }
  try {
    const [targetColMap, salesColMap] = await Promise.all([
      resolveColumnMap(cfg.targetId),
      resolveColumnMap(cfg.salesId),
    ]);
    const roleWhereTarget = buildGqlWhere(targetColMap, state.user, {});
    const roleWhereSales = buildGqlWhere(salesColMap, state.user, {}, { forSales: true });
    const isManagerTier = state.user.title !== "SALES MEN";

    // Run as a limited-concurrency batch (max 3 in flight), not all at once —
    // see runLimited's note in dashboard.js. Keeps this from opening ~8
    // simultaneous connections to Google on every login/refresh.
    const [salesRows, agencyOpts, custGroupOpts, promoOpts, prodGroupOpts, groupOpts, collectorOpts, managerOpts] = await runLimited([
      () => fetchSheetRows(cfg.salesId, roleWhereSales),
      () => targetDistinctValues(cfg.targetId, targetColMap, "Agency", roleWhereTarget),
      () => targetDistinctValues(cfg.targetId, targetColMap, "Cust Group", roleWhereTarget),
      () => targetDistinctValues(cfg.targetId, targetColMap, "Promo_Regular ?", roleWhereTarget),
      () => targetDistinctValues(cfg.targetId, targetColMap, "Product Group", roleWhereTarget),
      () => targetDistinctValues(cfg.targetId, targetColMap, "GROUP", roleWhereTarget),
      () => (isManagerTier ? targetDistinctValues(cfg.targetId, targetColMap, "Collector", roleWhereTarget) : Promise.resolve([])),
      () => (isManagerTier ? targetDistinctValues(cfg.targetId, targetColMap, "MANAGERS", roleWhereTarget) : Promise.resolve([])),
    ], 3);

    state.cache[monthKey] = {
      salesRows, targetColMap, salesColMap,
      targetSheetId: cfg.targetId, salesSheetId: cfg.salesId,
      filterOptions: { agency: agencyOpts, custGroup: custGroupOpts, promoReg: promoOpts, prodGroup: prodGroupOpts, group: groupOpts, collector: collectorOpts, managers: managerOpts },
      fetchedAt: new Date(),
    };
    state.loading = false;
    state.error = null;
  } catch (err) {
    state.loading = false;
    state.error = "Could not load data for " + cfg.label + ": " + err.message + " Try Refresh.";
  }
  renderApp();
}
