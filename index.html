function renderApp() {
  if (!state.user) return renderLogin();
  if (!$("#shell")) renderAppShell();
  renderStatusBar();
  renderPageNav();
  renderFilterBar();
  renderContent();
}

/* ---------------------------------------------------------------------
   PAGE NAVIGATION (Summary / All Customers-Outlets / Yesterday's Sales)
   --------------------------------------------------------------------- */
const PAGES = [
  { key: "summary", label: "Summary" },
  { key: "outlets", label: "All Customers / Outlets" },
  { key: "outletdetail", label: "Outlet Details" },
  { key: "zerobilling", label: "0 Billing" },
  // Only shown to a user with an entry in AGENCY_FOCUS_ASSIGNMENTS (currently
  // Sushant, Junaid, Hayat) — everyone else never even sees the tab exist.
  { key: "agencyfocus", label: "Agency Focus", visible: (user) => !!AGENCY_FOCUS_ASSIGNMENTS[user.username] },
  { key: "yesterday", label: "Yesterday's Sales" },
];

function visiblePages() {
  return PAGES.filter((p) => !p.visible || p.visible(state.user));
}

function renderPageNav() {
  const bar = $("#pagenav");
  if (!bar) return;
  bar.innerHTML = "";
  visiblePages().forEach((p) => {
    const btn = el("button", {
      class: "tab-btn" + (state.page === p.key ? " tab-btn-active" : ""),
      type: "button",
      onclick: () => setPage(p.key),
    }, [p.label]);
    bar.appendChild(btn);
  });
}

/* A lighter-weight switch than renderApp()/renderContent(): reuses
   whichever page's data is already cached (snappy switch back to a tab
   you already visited) and only fetches fresh data the first time a
   page is opened in this session. scheduleContentRefresh() below is
   what invalidates that cache when a filter or month actually changes. */
function setPage(key) {
  if (state.page === key) return;
  state.page = key;
  renderPageNav();
  renderFilterBar();
  if (key === "summary") { if (currentSummary) renderSummaryTables(); else fetchAndRenderContent(); }
  else if (key === "outlets") { if (currentOutlets) renderOutletsPage(); else fetchAndRenderOutlets(); }
  else if (key === "yesterday") { if (state.pageYesterday && state.pageYesterday.data) renderYesterdayPage(); else fetchAndRenderYesterday(); }
  else if (key === "outletdetail") {
    renderOutletDetailPage(); // handles fetching its own outlet list internally
    if (state.pageOutletDetail.custCode && !outletDetailAgencies && !outletDetailLoading) fetchOutletDetailAgencies();
  }
  else if (key === "zerobilling") { if (currentZeroBilling) renderZeroBillingPage(); else fetchAndRenderZeroBilling(); }
  else if (key === "agencyfocus") {
    renderAgencyFocusPage(); // handles picking a default agency internally
    if (state.pageAgencyFocus.agency && !currentAgencyFocus && !agencyFocusLoading) fetchAndRenderAgencyFocus();
  }
}

/* Re-render whichever page is currently active without re-fetching —
   used by table column-sort clicks (renderTable below), which only
   need to re-sort already-fetched data. */
function rerenderCurrentPage() {
  if (state.page === "outlets") renderOutletsPage();
  else if (state.page === "yesterday") renderYesterdayPage();
  else if (state.page === "outletdetail") renderOutletDetailPage();
  else if (state.page === "zerobilling") renderZeroBillingPage();
  else if (state.page === "agencyfocus") renderAgencyFocusPage();
  else renderSummaryTables();
}

function renderStatusBar() {
  const bar = $("#statusbar");
  bar.innerHTML = "";
  const cached = state.cache[state.month];
  const parts = [];
  if (state.loading) {
    parts.push(el("span", { class: "status-loading" }, ["Loading live data…"]));
  } else if (state.error) {
    parts.push(el("span", { class: "status-error" }, [state.error]));
  } else if (cached) {
    parts.push(el("span", { class: "status-ok" }, ["Last updated: " + cached.fetchedAt.toLocaleTimeString() + " — click Refresh now to update"]));
  }
  parts.push(el("button", { class: "btn btn-small", onclick: () => loadMonth(state.month) }, ["Refresh now"]));
  bar.appendChild(el("div", { class: "statusbar-inner" }, parts));
}

/* ---------------------------------------------------------------------
   FILTER BAR (connected across the whole app; single filters object)
   --------------------------------------------------------------------- */
function distinctValues(rows, field) {
  const s = new Set();
  rows.forEach((r) => { if (r[field]) s.add(r[field]); });
  return [...s].sort();
}

function multiSelectControl(labelText, allOptions, selectedArr, onChange) {
  const wrap = el("div", { class: "filter-group" });
  wrap.appendChild(el("div", { class: "filter-label" }, [labelText]));
  const box = el("div", { class: "multiselect" });
  const summary = el("button", { class: "multiselect-summary", type: "button" }, [
    selectedArr.length ? `${selectedArr.length} selected` : "All",
  ]);
  const panel = el("div", { class: "multiselect-panel hidden" });
  allOptions.forEach((opt) => {
    const id = "ms_" + labelText.replace(/\s+/g, "") + "_" + opt.replace(/[^a-zA-Z0-9]/g, "");
    const cb = el("input", { type: "checkbox", id });
    cb.checked = selectedArr.includes(opt);
    cb.addEventListener("change", () => {
      const idx = selectedArr.indexOf(opt);
      if (cb.checked && idx === -1) selectedArr.push(opt);
      if (!cb.checked && idx !== -1) selectedArr.splice(idx, 1);
      onChange(selectedArr);
    });
    const row = el("label", { class: "multiselect-row", for: id }, [cb, " " + opt]);
    panel.appendChild(row);
  });
  summary.addEventListener("click", () => panel.classList.toggle("hidden"));
  box.appendChild(summary);
  box.appendChild(panel);
  wrap.appendChild(box);
  return wrap;
}

function singleSelectControl(labelText, options, currentVal, onChange, disabledNote) {
  const wrap = el("div", { class: "filter-group" });
  wrap.appendChild(el("div", { class: "filter-label" }, [labelText]));
  if (disabledNote) {
    wrap.appendChild(el("div", { class: "filter-disabled-note" }, [disabledNote]));
    return wrap;
  }
  const sel = el("select", { class: "input input-small" }, options.map((o) =>
    el("option", { value: o.value, selected: o.value === currentVal ? "selected" : undefined }, [o.label])
  ));
  sel.value = currentVal;
  sel.addEventListener("change", () => onChange(sel.value));
  wrap.appendChild(sel);
  return wrap;
}

function renderFilterBar() {
  const bar = $("#filterbar");
  bar.innerHTML = "";

  if (state.page === "yesterday") {
    bar.appendChild(el("div", { class: "filterbar-note" }, [
      "Yesterday's Sales always shows your full previous day — Agency/Product/other filters above don't apply here.",
    ]));
    return;
  }

  const cached = state.cache[state.month];
  const opts = cached ? cached.filterOptions : { agency: [], custGroup: [], promoReg: [], prodGroup: [], group: [], collector: [], managers: [] };
  const isManagerTier = state.user.title !== "SALES MEN";

  const row1 = el("div", { class: "filterbar-row" });
  const row2 = el("div", { class: "filterbar-row" });

  // Month
  row1.appendChild(singleSelectControl("Month", MONTHS.map((m) => ({ value: m.key, label: m.label })), state.month, (v) => {
    state.month = v;
    loadMonth(v);
  }));

  // Agency (multi) — hidden on Agency Focus, where the agency is fixed by
  // the page's own picker instead (a leftover selection here would just
  // be ignored there, which is more confusing left visible than hidden).
  if (state.page === "agencyfocus") {
    row1.appendChild(singleSelectControl("Agency", [], "ALL", () => {}, "Fixed to " + (state.pageAgencyFocus.agency || "the agency picked below") + " on this page"));
  } else {
    row1.appendChild(multiSelectControl("Agency", opts.agency, state.filters.agency, () => scheduleContentRefresh()));
  }

  // Food / Non Food
  const pgOptions = [{ value: "ALL", label: "All" }, ...opts.prodGroup.map((v) => ({ value: v, label: v }))];
  row1.appendChild(singleSelectControl("Food / Non-Food", pgOptions, state.filters.prodGroup, (v) => { state.filters.prodGroup = v; scheduleContentRefresh(); }));

  // Promo / Regular
  const prOptions = [{ value: "ALL", label: "All" }, ...opts.promoReg.map((v) => ({ value: v, label: v }))];
  row1.appendChild(singleSelectControl("Promo / Regular", prOptions, state.filters.promoReg, (v) => { state.filters.promoReg = v; scheduleContentRefresh(); }));

  // Cust Group (multi)
  row2.appendChild(multiSelectControl("Cust Group", opts.custGroup, state.filters.custGroup, () => scheduleContentRefresh()));

  // Major / Other (GROUP col) — placeholder until source data populates it
  if (opts.group.length) {
    const moOptions = [{ value: "ALL", label: "All" }, ...opts.group.map((v) => ({ value: v, label: v }))];
    row2.appendChild(singleSelectControl("Major / Other", moOptions, state.filters.majorOther, (v) => { state.filters.majorOther = v; scheduleContentRefresh(); }));
  } else {
    row2.appendChild(singleSelectControl("Major / Other", [], "ALL", () => {}, "Not yet available in source data"));
  }

  // Salesmen + Managers filters — manager tier only
  if (isManagerTier) {
    row2.appendChild(multiSelectControl("Salesmen", opts.collector, state.filters.salesmen, () => scheduleContentRefresh()));
    row2.appendChild(multiSelectControl("Managers", opts.managers, state.filters.managers, () => scheduleContentRefresh()));
  }

  bar.appendChild(row1);
  bar.appendChild(row2);

  // Search bar
  const searchWrap = el("div", { class: "searchbar" });
  const searchInput = el("input", {
    class: "input", type: "search",
    placeholder: "Search site code, item code, item desc, site, agency, brand, sub cat…",
    value: state.filters.search,
  });
  searchInput.addEventListener("input", () => { state.filters.search = searchInput.value; scheduleContentRefresh(); });
  searchWrap.appendChild(searchInput);
  bar.appendChild(searchWrap);
}

// click-outside closes open multiselect panels — registered once (not
// inside renderFilterBar, which runs on every month/login load and would
// otherwise stack up a fresh listener each time).
document.addEventListener("click", (e) => {
  document.querySelectorAll(".multiselect-panel").forEach((p) => {
    if (!p.classList.contains("hidden") && !p.parentElement.contains(e.target)) p.classList.add("hidden");
  });
});

/* ---------------------------------------------------------------------
   TABLE RENDERING (generic, sortable)
   --------------------------------------------------------------------- */
function renderTable(tableId, title, columns, rows, opts) {
  opts = opts || {};
  const sx = opts.secondaryExpand;
  ensureSecondaryExpandState(sx);
  const timeGonePct = computeTimeGonePct(state.month);
  const wrap = el("div", { class: "table-card" });
  const sortState = state.sort[tableId] || { col: null, dir: -1 };
  let sorted = rows.slice();
  if (sortState.col) {
    sorted.sort((a, b) => {
      const va = a[sortState.col], vb = b[sortState.col];
      if (typeof va === "string" || typeof vb === "string") return String(va).localeCompare(String(vb)) * sortState.dir;
      return ((va || 0) - (vb || 0)) * sortState.dir;
    });
  }
  registerTableForDownload(title, columns, sorted);
  const titleBar = el("div", { class: "table-title" }, [el("span", { class: "table-title-text" }, [title])]);
  if (sorted.length) {
    const dlBtn = el("button", { class: "btn-download", type: "button", title: "Download this table as CSV (opens in Excel)" }, ["⬇ CSV"]);
    dlBtn.addEventListener("click", () => downloadTableCSV(title, columns, sorted));
    titleBar.appendChild(dlBtn);
  }
  wrap.appendChild(titleBar);
  const scrollWrap = el("div", { class: "table-scroll" });
  const table = el("table", { class: "data-table" });
  const thead = el("thead");
  const headRow = el("tr");
  columns.forEach((c) => {
    const th = el("th", { class: c.numeric ? "num" : "" }, [c.label + (sortState.col === c.key ? (sortState.dir === 1 ? " ▲" : " ▼") : "")]);
    th.addEventListener("click", () => {
      const cur = state.sort[tableId] || { col: null, dir: -1 };
      state.sort[tableId] = { col: c.key, dir: cur.col === c.key ? -cur.dir : -1 };
      rerenderCurrentPage(); // re-sort only — no need to re-fetch
    });
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);
  const tbody = el("tbody");
  if (!sorted.length) {
    tbody.appendChild(el("tr", {}, [el("td", { colspan: String(columns.length), class: "empty-row" }, ["No data for the current filters."])]));
  }
  sorted.forEach((r) => {
    const rowCls = opts.rowClass ? (opts.rowClass(r) || "") : "";
    const tr = el("tr", rowCls ? { class: rowCls } : null);
    columns.forEach((c) => {
      const val = c.fmt ? c.fmt(r[c.key], r) : r[c.key];
      let cls = c.numeric ? "num" : "";
      if (c.timeGoneCompare) {
        const raw = c.raw ? c.raw(r) : r[c.key];
        if (typeof raw === "number" && !isNaN(raw)) cls += (raw < timeGonePct ? " pct-behind" : " pct-ahead");
      }
      const td = el("td", { class: cls }, [val == null ? "-" : String(val)]);
      if (sx && c.key === sx.columnKey) td.appendChild(secondaryExpandButtonFor(sx, r));
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
    if (sx) {
      const detailTr = secondaryExpandDetailRowFor(sx, r, columns.length);
      if (detailTr) tbody.appendChild(detailTr);
    }
  });
  table.appendChild(tbody);
  scrollWrap.appendChild(table);
  wrap.appendChild(scrollWrap);
  return wrap;
}

/* ---------------------------------------------------------------------
   EXPANDABLE TABLE (a "+"/"−" per row that reveals a nested breakdown)
   Used by: All Customers/Outlets (outlet -> agency-wise) and Yesterday's
   Sales' Outlet-wise table (outlet -> SKU-wise). Expand state and fetched
   detail are cached per tableId+rowKey so re-expanding a row already
   opened this session doesn't refetch, and collapsing never throws the
   data away. Cleared only when that page's top-level data is genuinely
   refetched (new filters/month, or a fresh day) — see fetchAndRenderOutlets
   / fetchAndRenderYesterday.
   --------------------------------------------------------------------- */
const expandState = {};  // tableId -> Set(rowKey)
const expandCache = {};  // tableId -> Map(rowKey -> { rows } | { error })

function resetExpandable(tableId) {
  expandState[tableId] = new Set();
  expandCache[tableId] = new Map();
}

function toggleExpand(tableId, key, row, opts) {
  const set = expandState[tableId] = expandState[tableId] || new Set();
  expandCache[tableId] = expandCache[tableId] || new Map();
  if (set.has(key)) {
    set.delete(key);
    rerenderCurrentPage();
    return;
  }
  set.add(key);
  rerenderCurrentPage(); // show "Loading…" (or already-cached detail) immediately
  if (expandCache[tableId].has(key)) return; // already have the detail — nothing to fetch
  Promise.resolve(opts.loadDetail(row)).then((rows) => {
    expandCache[tableId].set(key, { rows });
    rerenderCurrentPage();
  }).catch((err) => {
    expandCache[tableId].set(key, { error: "Could not load detail: " + err.message });
    rerenderCurrentPage();
  });
}

/* ---------------------------------------------------------------------
   SECONDARY "+"/"−" TOGGLE — an inline expand button embedded in one
   specific column's cell (rather than its own leading column), used by
   BOTH renderTable and renderExpandableTable via opts.secondaryExpand:
   { columnKey (which column's cell gets the inline button), tableId (its
   own expand/cache namespace, independent of the table's primary one, if
   any), keyOf(row)->string, loadDetail(row)->Array|Promise<Array>,
   detailColumns, detailTitle(row)->string, detailRowClass?(detailRow)->
   string, emptyText?: string, buttonTitle?/collapseTitle?: string }.
   Reuses the exact same expandState/expandCache/toggleExpand machinery
   as the primary "+" column, just keyed under its own tableId so the two
   never collide on the same row. First introduced for the "All Customers
   / Outlets" page (outlet row -> SKUs never supplied this month) and the
   Agency Focus page's three tables (outlets/SKUs not supplied, per
   Promo-Regular type / per outlet / per SKU).
   --------------------------------------------------------------------- */
function ensureSecondaryExpandState(sx) {
  if (!sx) return;
  expandState[sx.tableId] = expandState[sx.tableId] || new Set();
  expandCache[sx.tableId] = expandCache[sx.tableId] || new Map();
}
function secondaryExpandButtonFor(sx, r) {
  const key2 = sx.keyOf(r);
  const isExpanded2 = expandState[sx.tableId].has(key2);
  const btn = el("button", { class: "sx-btn", type: "button", title: isExpanded2 ? (sx.collapseTitle || "Hide") : (sx.buttonTitle || "Show breakdown") }, [isExpanded2 ? "−" : "+"]);
  btn.addEventListener("click", (e) => { e.stopPropagation(); toggleExpand(sx.tableId, key2, r, sx); });
  return btn;
}
function secondaryExpandDetailRowFor(sx, r, colspan) {
  const key2 = sx.keyOf(r);
  if (!expandState[sx.tableId].has(key2)) return null;
  const detailTr2 = el("tr", { class: "detail-row" });
  const detailTd2 = el("td", { colspan: String(colspan), class: "detail-cell" });
  const cacheEntry2 = expandCache[sx.tableId].get(key2);
  if (!cacheEntry2) {
    detailTd2.appendChild(el("div", { class: "loading-block loading-block-inline" }, ["Loading…"]));
  } else if (cacheEntry2.error) {
    detailTd2.appendChild(el("div", { class: "error-block" }, [cacheEntry2.error]));
  } else if (!cacheEntry2.rows.length) {
    detailTd2.appendChild(el("div", { class: "loading-block loading-block-inline" }, [sx.emptyText || "Nothing to show."]));
  } else {
    detailTd2.appendChild(renderTable(
      sx.tableId + "__d__" + key2,
      sx.detailTitle ? sx.detailTitle(r) : "",
      sx.detailColumns,
      cacheEntry2.rows,
      { rowClass: sx.detailRowClass }
    ));
  }
  detailTr2.appendChild(detailTd2);
  return detailTr2;
}

/* opts: { keyOf(row)->string, loadDetail(row)->Array|Promise<Array>,
   detailColumns, detailTitle(row)->string, detailRowClass?(detailRow)->string
   — optional per-row CSS class for the nested detail table, e.g. to
   highlight a SKU never supplied this month in red.

   opts.secondaryExpand (optional) — a SECOND, independent "+"/"−" toggle
   embedded inline in one specific column's cell (rather than its own
   leading column), with its own expand-state/cache namespace so it never
   interferes with the primary "+" column. Shape: { columnKey (which
   column's cell gets the inline button), tableId (its own expand/cache
   namespace), keyOf(row)->string, loadDetail(row)->Array|Promise<Array>,
   detailColumns, detailTitle(row)->string, detailRowClass?(detailRow)->
   string, emptyText?: string, buttonTitle?/collapseTitle?: string }. Used
   by the "All Customers / Outlets" page to let a manager expand exactly
   the SKU Dist Target figure on a row into the list of that outlet's
   target-bearing SKUs never supplied this month, without disturbing the
   existing per-row agency breakdown "+" . */
function renderExpandableTable(tableId, title, columns, rows, opts) {
  expandState[tableId] = expandState[tableId] || new Set();
  expandCache[tableId] = expandCache[tableId] || new Map();
  const sx = opts.secondaryExpand;
  ensureSecondaryExpandState(sx);

  const timeGonePct = computeTimeGonePct(state.month);
  const wrap = el("div", { class: "table-card" });
  const sortState = state.sort[tableId] || { col: null, dir: -1 };
  let sorted = rows.slice();
  if (sortState.col) {
    sorted.sort((a, b) => {
      const va = a[sortState.col], vb = b[sortState.col];
      if (typeof va === "string" || typeof vb === "string") return String(va).localeCompare(String(vb)) * sortState.dir;
      return ((va || 0) - (vb || 0)) * sortState.dir;
    });
  }
  registerTableForDownload(title, columns, sorted);
  const titleBar = el("div", { class: "table-title" }, [el("span", { class: "table-title-text" }, [title])]);
  if (sorted.length) {
    const dlBtn = el("button", { class: "btn-download", type: "button", title: "Download this table as CSV (opens in Excel)" }, ["⬇ CSV"]);
    dlBtn.addEventListener("click", () => downloadTableCSV(title, columns, sorted));
    titleBar.appendChild(dlBtn);
  }
  wrap.appendChild(titleBar);
  const scrollWrap = el("div", { class: "table-scroll" });
  const table = el("table", { class: "data-table" });
  const thead = el("thead");
  const headRow = el("tr");
  headRow.appendChild(el("th", { class: "expand-col" }, [""]));
  columns.forEach((c) => {
    const th = el("th", { class: c.numeric ? "num" : "" }, [c.label + (sortState.col === c.key ? (sortState.dir === 1 ? " ▲" : " ▼") : "")]);
    th.addEventListener("click", () => {
      const cur = state.sort[tableId] || { col: null, dir: -1 };
      state.sort[tableId] = { col: c.key, dir: cur.col === c.key ? -cur.dir : -1 };
      rerenderCurrentPage();
    });
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);
  const tbody = el("tbody");
  if (!sorted.length) {
    tbody.appendChild(el("tr", {}, [el("td", { colspan: String(columns.length + 1), class: "empty-row" }, ["No data for the current filters."])]));
  }
  sorted.forEach((r) => {
    const key = opts.keyOf(r);
    const isExpanded = expandState[tableId].has(key);
    const tr = el("tr");
    const btn = el("button", { class: "expand-btn", type: "button", title: isExpanded ? "Show overall only" : "Show breakdown" }, [isExpanded ? "−" : "+"]);
    btn.addEventListener("click", () => toggleExpand(tableId, key, r, opts));
    tr.appendChild(el("td", { class: "expand-col" }, [btn]));
    columns.forEach((c) => {
      const val = c.fmt ? c.fmt(r[c.key], r) : r[c.key];
      let cls = c.numeric ? "num" : "";
      if (c.timeGoneCompare) {
        const raw = c.raw ? c.raw(r) : r[c.key];
        if (typeof raw === "number" && !isNaN(raw)) cls += (raw < timeGonePct ? " pct-behind" : " pct-ahead");
      }
      const td = el("td", { class: cls }, [val == null ? "-" : String(val)]);
      if (sx && c.key === sx.columnKey) td.appendChild(secondaryExpandButtonFor(sx, r));
      tr.appendChild(td);
    });
    tbody.appendChild(tr);

    if (isExpanded) {
      const detailTr = el("tr", { class: "detail-row" });
      const detailTd = el("td", { colspan: String(columns.length + 1), class: "detail-cell" });
      const cacheEntry = expandCache[tableId].get(key);
      if (!cacheEntry) {
        detailTd.appendChild(el("div", { class: "loading-block loading-block-inline" }, ["Loading…"]));
      } else if (cacheEntry.error) {
        detailTd.appendChild(el("div", { class: "error-block" }, [cacheEntry.error]));
      } else if (!cacheEntry.rows.length) {
        detailTd.appendChild(el("div", { class: "loading-block loading-block-inline" }, ["No breakdown available."]));
      } else {
        detailTd.appendChild(renderTable(
          tableId + "__d__" + key,
          opts.detailTitle ? opts.detailTitle(r) : "",
          opts.detailColumns,
          cacheEntry.rows,
          { rowClass: opts.detailRowClass }
        ));
      }
      detailTr.appendChild(detailTd);
      tbody.appendChild(detailTr);
    }

    if (sx) {
      const detailTr2 = secondaryExpandDetailRowFor(sx, r, columns.length + 1);
      if (detailTr2) tbody.appendChild(detailTr2);
    }
  });
  table.appendChild(tbody);
  scrollWrap.appendChild(table);
  wrap.appendChild(scrollWrap);
  return wrap;
}

const METRIC_COLUMNS = [
  { key: "label", label: "" },
  { key: "target", label: "Target", numeric: true, fmt: (v) => fmtNum(v, 0) },
  { key: "net", label: "Achievement", numeric: true, fmt: (v) => fmtNum(v, 0) },
  { key: "return", label: "Return", numeric: true, fmt: (v) => fmtNum(v, 0) },
  { key: "btg", label: "BTG", numeric: true, fmt: (v) => fmtNum(v, 0) },
  { key: "achPct", label: "Ach %", numeric: true, fmt: (v) => fmtPct(v), timeGoneCompare: true, raw: (r) => r.achPct },
  { key: "distTarget", label: "Dist Target", numeric: true, fmt: (v) => fmtNum(v, 0) },
  { key: "distAch", label: "Dist Ach", numeric: true, fmt: (v) => fmtNum(v, 0) },
  { key: "distPct", label: "Dist %", numeric: true, fmt: (v) => fmtPct(v), timeGoneCompare: true, raw: (r) => r.distPct },
];

/* distType: "outlet" or "sku" — which dimension "distribution" counts in
   this particular table, spelled out in the column headers themselves so
   it's never ambiguous which one you're looking at. */
function metricColumnsWithLabel(labelHeader, distType) {
  const distWord = distType === "sku" ? "SKU" : "Outlet";
  const cols = METRIC_COLUMNS.map((c) => Object.assign({}, c));
  cols[0] = { key: "label", label: labelHeader };
  cols.forEach((c) => {
    if (c.key === "distTarget") c.label = distWord + " Dist Target";
    if (c.key === "distAch") c.label = distWord + " Dist Ach";
    if (c.key === "distPct") c.label = distWord + " Dist %";
  });
  return cols;
}

/* ---------------------------------------------------------------------
   KPI CARDS
   --------------------------------------------------------------------- */
function renderKpiCards(overall) {
  const timeGonePct = computeTimeGonePct(state.month);
  // rawPct === null means "don't color this card against time-gone"
  // (Time Gone itself, and the plain count/amount cards).
  const cards = [
    ["Time Gone %", fmtPct(timeGonePct), null],
    ["Target", fmtNum(overall.target, 0), null],
    ["Achievement (Net)", fmtNum(overall.net, 0), null],
    ["BTG", fmtNum(overall.btg, 0), null],
    ["Ach %", fmtPct(overall.achPct), overall.achPct],
    ["Return", fmtNum(overall.return, 0), null],
    ["Outlet Distribution Target", fmtNum(overall.distTarget, 0), null],
    ["Outlet Distribution Ach", fmtNum(overall.distAch, 0), null],
    ["Outlet Distribution %", fmtPct(overall.distPct), overall.distPct],
  ];
  registerTableForDownload("KPI Summary", [{ key: "metric", label: "Metric" }, { key: "value", label: "Value" }], cards.map(([label, val]) => ({ metric: label, value: val })));
  const wrap = el("div", { class: "kpi-grid" });
  cards.forEach(([label, val, rawPct]) => {
    let valClass = "kpi-value";
    if (typeof rawPct === "number" && !isNaN(rawPct)) valClass += (rawPct < timeGonePct ? " pct-behind" : " pct-ahead");
    wrap.appendChild(el("div", { class: "kpi-card" }, [
      el("div", { class: valClass }, [val]),
      el("div", { class: "kpi-label" }, [label]),
    ]));
  });
  return wrap;
}

/* ---------------------------------------------------------------------
   MAIN CONTENT (Summary page — Phase 1)

   Filter changes need a fresh round of small GQL queries against the
   TARGET sheet (it's too large to filter client-side), so rapid filter
   clicks are debounced into one fetch via scheduleContentRefresh(). A
   request-id guard discards a stale response if the filters changed
   again before the previous fetch finished. Sorting a table never
   re-fetches — it just re-renders the already-fetched summary.
   --------------------------------------------------------------------- */
let currentSummary = null;
let currentOutlets = null;
let outletsLoading = false;
let outletsError = null;

/* Filters/month apply to Summary, All Customers/Outlets, Outlet Details,
   and 0 Billing, so any change invalidates all four — whichever page is
   active refreshes right away below; the others just lazily refetch next
   time you switch to them (see setPage), rather than all refetching on
   every keystroke. */
function scheduleContentRefresh() {
  currentSummary = null;
  currentOutlets = null;
  currentZeroBilling = null;
  outletDetailAgencies = null; // the selected outlet's agency breakdown also depends on the active filters
  currentAgencyFocus = null; // the selected agency's breakdown also depends on the active (non-Agency) filters
  if (state._contentDebounceTimer) clearTimeout(state._contentDebounceTimer);
  state._contentDebounceTimer = setTimeout(() => {
    if (state.page === "outlets") fetchAndRenderOutlets();
    else if (state.page === "summary") fetchAndRenderContent();
    else if (state.page === "zerobilling") fetchAndRenderZeroBilling();
    else if (state.page === "outletdetail" && state.pageOutletDetail.custCode) fetchOutletDetailAgencies();
    else if (state.page === "agencyfocus" && state.pageAgencyFocus.agency) fetchAndRenderAgencyFocus();
  }, 350);
  // Immediately show a lightweight "updating" state so the UI responds instantly.
  if (state.page === "outlets") { outletsLoading = true; renderOutletsPage(); }
  else if (state.page === "summary") { state.summaryLoading = true; renderSummaryTables(); }
  else if (state.page === "zerobilling") { zeroBillingLoading = true; renderZeroBillingPage(); }
  else if (state.page === "outletdetail") { outletDetailLoading = true; renderOutletDetailPage(); }
  else if (state.page === "agencyfocus") { agencyFocusLoading = true; renderAgencyFocusPage(); }
}

async function fetchAndRenderContent() {
  const content = $("#content");
  if (!content) return;
  const cached = state.cache[state.month];
  if (!cached) return;

  const reqId = ++state._contentReqId;
  state.summaryLoading = true;
  state.summaryError = null;
  renderSummaryTables();

  try {
    const whereT = buildGqlWhere(cached.targetColMap, state.user, state.filters);
    const salesRowsScoped = applyFilters(cached.salesRows, state.filters);
    const summary = await buildSummaryData(cached.targetSheetId, cached.targetColMap, whereT, salesRowsScoped, state.user);
    if (reqId !== state._contentReqId) return; // a newer request superseded this one
    currentSummary = summary;
    state.summaryLoading = false;
    state.summaryError = null;
  } catch (err) {
    if (reqId !== state._contentReqId) return;
    state.summaryLoading = false;
    state.summaryError = "Could not compute summary: " + err.message;
  }
  renderSummaryTables();
}

function renderSummaryTables() {
  const content = $("#content");
  if (!content) return;
  content.innerHTML = "";
  resetPageTableRegistry();

  const cached = state.cache[state.month];
  if (state.loading && !cached) { content.appendChild(el("div", { class: "loading-block" }, ["Loading live data from Google Sheets…"])); return; }
  if (state.error && !cached) { content.appendChild(el("div", { class: "error-block" }, [state.error])); return; }
  if (!cached) { content.appendChild(el("div", { class: "loading-block" }, ["No data loaded yet."])); return; }

  content.appendChild(el("h2", { class: "page-title" }, ["Summary — " + MONTHS.find((m) => m.key === state.month).label]));

  if (state.summaryError) content.appendChild(el("div", { class: "error-block" }, [state.summaryError]));
  // A filter/month change re-queries Google Sheets fresh every time (the
  // TARGET sheet is too big to filter client-side) — on a slow moment
  // that can take a while. Make it unmistakable something IS happening,
  // rather than leaving the old numbers sitting there looking inert.
  if (state.summaryLoading && currentSummary) {
    content.appendChild(el("div", { class: "updating-banner" }, ["Updating with your new filters — this can take a little while on a slow connection…"]));
  } else if (state.summaryLoading) {
    content.appendChild(el("div", { class: "loading-block" }, ["Updating…"]));
  }
  if (!currentSummary) {
    if (!state.summaryLoading && !state.summaryError) content.appendChild(el("div", { class: "loading-block" }, ["Loading…"]));
    return;
  }

  const summary = currentSummary;
  const tablesWrap = el("div", { class: state.summaryLoading ? "content-stale" : "" });
  tablesWrap.appendChild(renderKpiCards(summary.overall));
  tablesWrap.appendChild(renderTable("agency", "Agency-wise Performance", metricColumnsWithLabel("Agency", "outlet"), summary.byAgency));
  tablesWrap.appendChild(renderTable("promo", "Promo / Regular Performance", metricColumnsWithLabel("Type", "outlet"), summary.byPromo));
  tablesWrap.appendChild(renderTable("topcust", "Top 10 Customers (by Target) — distribution = SKUs at this outlet", metricColumnsWithLabel("Outlet", "sku"), summary.topCustomers));
  tablesWrap.appendChild(renderTable("topsku", "Top 20 SKUs (by Target) — distribution = outlets carrying this SKU", metricColumnsWithLabel("SKU", "outlet"), summary.topSkus));

  if (summary.bySalesman) {
    tablesWrap.appendChild(renderTable("bysales", "Salesmen-wise Performance", SALESMAN_COLUMNS, summary.bySalesman));
  }
  content.appendChild(renderPageDownloadToolbar("Summary — " + MONTHS.find((m) => m.key === state.month).label));
  content.appendChild(tablesWrap);
}

// Kept for compatibility with call sites (e.g. right after a month/login load) —
// this is the "full reload" entry point, page-aware: dispatches to whichever
// page is active and always forces a fresh fetch (unlike setPage, which
// reuses already-cached data for a fast tab switch).
function renderContent() {
  if (state.page === "outlets") { currentOutlets = null; fetchAndRenderOutlets(); return; }
  if (state.page === "yesterday") { fetchAndRenderYesterday(); return; }
  if (state.page === "zerobilling") { currentZeroBilling = null; fetchAndRenderZeroBilling(); return; }
  if (state.page === "outletdetail") {
    currentOutlets = null;
    outletDetailAgencies = null;
    renderOutletDetailPage(); // fetches its own outlet-list internally when currentOutlets is null
    if (state.pageOutletDetail.custCode) fetchOutletDetailAgencies();
    return;
  }
  if (state.page === "agencyfocus") {
    currentAgencyFocus = null;
    renderAgencyFocusPage(); // picks a default agency internally if none is set yet
    if (state.pageAgencyFocus.agency) fetchAndRenderAgencyFocus();
    return;
  }
  currentSummary = null;
  fetchAndRenderContent();
}

/* ---------------------------------------------------------------------

   Customers" table, but every outlet in scope, not just the top 10.
   Respects the same Agency/Product Group/etc. filters as Summary.

  renderOutletsPage();

  try {

    outletsError = null;

    if (reqId !== state._contentReqId) return;
    outletsLoading = false;
    outletsError = "Could not load outlets: " + err.message;
  }
  renderOutletsPage();
}

   its agency-wise Target/Achievement (same shape as the Outlets page's
   "+" breakdown, reused directly), then can "+" any agency row to see
   that agency's SKU-wise Target/Sale at this one outlet, including when
   it was last supplied this month — highlighted red if never supplied
   this month at all.
   --------------------------------------------------------------------- */
let outletDetailAgencies = null; // { rows } — the selected outlet's agency-wise breakdown
let outletDetailLoading = false;
let outletDetailError = null;
let odListLoading = false; // loading state for the outlet-picker's own list (reuses currentOutlets as the source of truth)
let odListError = null;

/* Populates currentOutlets (the same full outlet list the Outlets page
   uses) if it isn't already loaded — reused rather than duplicated so
   visiting both pages in one session doesn't double-query Google. */
async function ensureOutletsListForSelector() {
  if (currentOutlets || odListLoading) return currentOutlets;
  const cached = state.cache[state.month];
  if (!cached) return null;
  odListLoading = true;
  odListError = null;
  renderOutletDetailPage();
  try {
    const whereT = buildGqlWhere(cached.targetColMap, state.user, state.filters);
    const salesRowsScoped = applyFilters(cached.salesRows, state.filters);
    currentOutlets = await buildOutletsData(cached.targetSheetId, cached.targetColMap, whereT, salesRowsScoped);
  } catch (err) {
    odListError = "Could not load your outlet list: " + err.message;
  }
  odListLoading = false;
  renderOutletDetailPage();
  return currentOutlets;
}

function selectOutletDetail(custCode, label) {
  state.pageOutletDetail = { custCode, label };
  outletDetailAgencies = null;
  fetchOutletDetailAgencies();
}

async function fetchOutletDetailAgencies() {
  const content = $("#content");
  if (!content) return;
  const cached = state.cache[state.month];
  const custCode = state.pageOutletDetail.custCode;
  if (!cached || !custCode) return;

  const reqId = ++state._contentReqId;
  outletDetailLoading = true;
  outletDetailError = null;

  renderOutletDetailPage();

  try {
    const whereT = buildGqlWhere(cached.targetColMap, state.user, state.filters);
    const salesRowsScoped = applyFilters(cached.salesRows, state.filters);
    const rows = await buildOutletAgencyBreakdown(cached.targetSheetId, cached.targetColMap, whereT, custCode, salesRowsScoped);
    if (reqId !== state._contentReqId) return; // a newer request superseded this one
    outletDetailAgencies = { rows };
    outletDetailLoading = false;
    outletDetailError = null;
  } catch (err) {
    if (reqId !== state._contentReqId) return;
    outletDetailLoading = false;
    outletDetailError = "Could not load agency breakdown: " + err.message;
  }
  renderOutletDetailPage();
}

function renderOutletDetailPage() {
  const content = $("#content");
  if (!content) return;
  content.innerHTML = "";
  resetPageTableRegistry();

  const cached = state.cache[state.month];
  if (state.loading && !cached) { content.appendChild(el("div", { class: "loading-block" }, ["Loading live data from Google Sheets…"])); return; }
  if (state.error && !cached) { content.appendChild(el("div", { class: "error-block" }, [state.error])); return; }
  if (!cached) { content.appendChild(el("div", { class: "loading-block" }, ["No data loaded yet."])); return; }

  content.appendChild(el("h2", { class: "page-title" }, ["Outlet Details — " + MONTHS.find((m) => m.key === state.month).label]));

  const selectorWrap = el("div", { class: "outlet-selector" });
  selectorWrap.appendChild(el("label", { class: "field-label" }, ["Select an outlet"]));
  if (odListError) {
    selectorWrap.appendChild(el("div", { class: "error-block" }, [odListError]));
  } else if (!currentOutlets) {
    selectorWrap.appendChild(el("div", { class: "loading-block" }, ["Loading your outlets…"]));
    if (!odListLoading) ensureOutletsListForSelector();
  } else {
    const sortedOutlets = currentOutlets.rows.slice().sort((a, b) => a.label.localeCompare(b.label));
    const options = [el("option", { value: "" }, ["Select an outlet..."])].concat(
      sortedOutlets.map((r) => el("option", { value: r._custCode }, [r.label]))
    );
    const sel = el("select", { class: "input", id: "outletDetailSelect" }, options);
    sel.value = state.pageOutletDetail.custCode || "";

      if (!sel.value) { state.pageOutletDetail = { custCode: null, label: null }; outletDetailAgencies = null; renderOutletDetailPage(); return; }
      const picked = currentOutlets.rows.find((r) => r._custCode === sel.value);

    });

  content.appendChild(selectorWrap);

    "od_agency",

  ));
  content.appendChild(renderPageDownloadToolbar("Outlet Details — " + state.pageOutletDetail.label + " — " + MONTHS.find((m) => m.key === state.month).label));
  content.appendChild(wrap);
}

  const reqId = ++state._contentReqId;
  zeroBillingLoading = true;
  zeroBillingError = null;
  renderZeroBillingPage();

  try {
    const whereT = buildGqlWhere(cached.targetColMap, state.user, state.filters);
    const salesRowsScoped = applyFilters(cached.salesRows, state.filters);
    const [outlets, skus] = await Promise.all([
      buildOutletsData(cached.targetSheetId, cached.targetColMap, whereT, salesRowsScoped),
      buildSkusData(cached.targetSheetId, cached.targetColMap, whereT, salesRowsScoped),
    ]);
    if (reqId !== state._contentReqId) return; // a newer request superseded this one
    currentZeroBilling = buildZeroBillingData(outlets.rows, skus.rows);
    zeroBillingLoading = false;
    zeroBillingError = null;
  } catch (err) {
    if (reqId !== state._contentReqId) return;
    zeroBillingLoading = false;
    zeroBillingError = "Could not load 0 billing data: " + err.message;
  }
  renderZeroBillingPage();
}

const ZERO_OUTLET_COLUMNS = [
  { key: "label", label: "Outlet" },
  { key: "target", label: "Target", numeric: true, fmt: (v) => fmtNum(v, 0) },
];
const ZERO_SKU_COLUMNS = [
  { key: "label", label: "SKU" },
  { key: "target", label: "Target", numeric: true, fmt: (v) => fmtNum(v, 0) },
];

function renderZeroBillingPage() {
  const content = $("#content");
  if (!content) return;
  content.innerHTML = "";
  resetPageTableRegistry();

  const cached = state.cache[state.month];
  if (state.loading && !cached) { content.appendChild(el("div", { class: "loading-block" }, ["Loading live data from Google Sheets…"])); return; }
  if (state.error && !cached) { content.appendChild(el("div", { class: "error-block" }, [state.error])); return; }
  if (!cached) { content.appendChild(el("div", { class: "loading-block" }, ["No data loaded yet."])); return; }

  content.appendChild(el("h2", { class: "page-title" }, ["0 Billing — " + MONTHS.find((m) => m.key === state.month).label]));

  if (zeroBillingError) content.appendChild(el("div", { class: "error-block" }, [zeroBillingError]));
  if (zeroBillingLoading && currentZeroBilling) {
    content.appendChild(el("div", { class: "updating-banner" }, ["Updating with your new filters — this can take a little while on a slow connection…"]));
  } else if (zeroBillingLoading) {
    content.appendChild(el("div", { class: "loading-block" }, ["Loading…"]));
  }
  if (!currentZeroBilling) {
    if (!zeroBillingLoading && !zeroBillingError) content.appendChild(el("div", { class: "loading-block" }, ["Loading…"]));
    return;
  }

  const z = currentZeroBilling;
  const wrap = el("div", { class: zeroBillingLoading ? "content-stale" : "" });

  const zbKpiCards = [
    ["0-Billed Outlets", fmtNum(z.outlets.length, 0)],
    ["Target (0-Billed Outlets)", fmtNum(z.outletsTotalTarget, 0)],
    ["0-Billed SKUs", fmtNum(z.skus.length, 0)],
    ["Target (0-Billed SKUs)", fmtNum(z.skusTotalTarget, 0)],
  ];
  registerTableForDownload("KPI Summary", [{ key: "metric", label: "Metric" }, { key: "value", label: "Value" }], zbKpiCards.map(([label2, val]) => ({ metric: label2, value: val })));
  const kpi = el("div", { class: "kpi-grid" }, zbKpiCards.map(([label2, val]) => el("div", { class: "kpi-card" }, [
    el("div", { class: "kpi-value" }, [val]),
    el("div", { class: "kpi-label" }, [label2]),
  ])));
  wrap.appendChild(kpi);

  wrap.appendChild(renderTable("zb_outlets", "0-Billed Outlets (" + z.outlets.length + ") — target exists but no sales this month (a return-driven negative counts as 0-billed too)", ZERO_OUTLET_COLUMNS, z.outlets));
  wrap.appendChild(renderTable("zb_skus", "0-Billed SKUs (" + z.skus.length + ") — target exists but not sold at any outlet this month", ZERO_SKU_COLUMNS, z.skus));

  content.appendChild(renderPageDownloadToolbar("0 Billing — " + MONTHS.find((m) => m.key === state.month).label));
  content.appendChild(wrap);
}

/* ---------------------------------------------------------------------
   AGENCY FOCUS PAGE — visible only to a user with an entry in
   AGENCY_FOCUS_ASSIGNMENTS (dashboard.js). Same KPI/Promo-Regular/Top
   Customers/Top SKUs/Salesmen-wise layout as Summary, but locked to one
   assigned agency (picked from a dropdown when more than one is
   assigned; auto-selected with no dropdown when there's only one — e.g.
   Sushant's single "KC CONSUMER"). Ignores the global Agency filter by
   design (see buildAgencyFocusData's note in dashboard.js) but still
   respects every other active filter (Product Group, Promo/Regular,
   Cust Group, Search, Salesmen/Managers for a manager-tier assignee).
   --------------------------------------------------------------------- */
let currentAgencyFocus = null;
let agencyFocusLoading = false;
let agencyFocusError = null;

function assignedAgenciesFor(user) {
  return (user && AGENCY_FOCUS_ASSIGNMENTS[user.username]) || [];
}

function selectAgencyFocus(agency) {
  state.pageAgencyFocus = { agency };
  currentAgencyFocus = null;
  fetchAndRenderAgencyFocus();
}

async function fetchAndRenderAgencyFocus() {
  const content = $("#content");
  if (!content) return;
  const cached = state.cache[state.month];
  const agency = state.pageAgencyFocus.agency;
  if (!cached || !agency) return;

  const reqId = ++state._contentReqId;
  agencyFocusLoading = true;
  agencyFocusError = null;
  // A real refetch (new filters/month, or a fresh agency pick) invalidates
  // any "+"-expanded not-supplied breakdowns on this page — they'd
  // otherwise keep showing a stale figure for the previous scope.
  resetExpandable("af_promo_notsupplied");
  resetExpandable("af_outlet_notsupplied");
  resetExpandable("af_sku_notsupplied");
  renderAgencyFocusPage();

  try {
    // Deliberately built from a copy of the filters with Agency cleared —
    // this page's own agency picker is the single source of truth for
    // which agency is in scope, never the global Agency filter.
    const filtersNoAgency = Object.assign({}, state.filters, { agency: [] });
    const whereBase = buildGqlWhere(cached.targetColMap, state.user, filtersNoAgency);
    const salesRowsScopedBase = applyFilters(cached.salesRows, filtersNoAgency);
    const data = await buildAgencyFocusData(cached.targetSheetId, cached.targetColMap, whereBase, agency, salesRowsScopedBase, state.user);
    if (reqId !== state._contentReqId) return; // a newer request superseded this one
    currentAgencyFocus = data;
    agencyFocusLoading = false;
    agencyFocusError = null;
  } catch (err) {
    if (reqId !== state._contentReqId) return;
    agencyFocusLoading = false;
    agencyFocusError = "Could not load " + agency + "'s figures: " + err.message;
  }
  renderAgencyFocusPage();
}

/* Shared by all three of this page's "+"-not-supplied breakdowns below —
   rebuilds the exact same agency-locked WHERE clause + sales-row slice
   fetchAndRenderAgencyFocus itself uses, from current state, at the
   moment the button is actually clicked (never prefetched). */
function agencyFocusWhereAndSales() {
  const cached = state.cache[state.month];
  if (!cached) return null;
  const agency = state.pageAgencyFocus.agency;
  const filtersNoAgency = Object.assign({}, state.filters, { agency: [] });
  const whereBase = buildGqlWhere(cached.targetColMap, state.user, filtersNoAgency);
  const salesRowsScopedBase = applyFilters(cached.salesRows, filtersNoAgency);
  const agencyId = colId(cached.targetColMap, ["Agency"]);
  const whereT = andJoin(whereBase, eqAny(agencyId, [agency]));
  const salesRowsScoped = salesRowsScopedBase.filter((r) => r.agency === agency);
  return { cached, whereT, salesRowsScoped, agency };
}

/* Outlet table's "+" (SKU Dist Target) — SKUs never supplied at that one
   outlet this month, within the locked agency. Reuses the exact same
   data-layer function the "All Customers / Outlets" page uses. */
function loadAgencyFocusOutletNotSuppliedSkus(row) {
  const ctx = agencyFocusWhereAndSales();
  if (!ctx) return [];
  return buildOutletSkuBreakdown(ctx.cached.targetSheetId, ctx.cached.targetColMap, ctx.whereT, row._custCode, ctx.salesRowsScoped)
    .then((rows) => rows.filter((r) => !r.lastSupply));
}

/* SKU table's "+" (Outlet Dist Target) — outlets never supplied this one
   SKU this month, within the locked agency. */
function loadAgencyFocusSkuNotSuppliedOutlets(row) {
  const ctx = agencyFocusWhereAndSales();
  if (!ctx) return [];
  return buildSkuOutletBreakdown(ctx.cached.targetSheetId, ctx.cached.targetColMap, ctx.whereT, row._itemCode, ctx.salesRowsScoped)
    .then((rows) => rows.filter((r) => !r.lastSupply));
}

/* Promo/Regular table's "+" (Outlet Dist Target) — outlets carrying a
   target under that one promo/regular type (within the locked agency)
   never supplied anything there yet this month. */
function loadAgencyFocusPromoNotSuppliedOutlets(row) {
  const ctx = agencyFocusWhereAndSales();
  if (!ctx) return [];
  return buildPromoOutletBreakdown(ctx.cached.targetSheetId, ctx.cached.targetColMap, ctx.whereT, row.label, ctx.salesRowsScoped)
    .then((rows) => rows.filter((r) => !r.lastSupply));
}

/* The Agency Focus outlet table's own column set — the standard Outlet/
   sku-distribution columns plus one extra "Salesman" column right after
   the outlet name (buildAgencyFocusOutletsData attaches row.salesman). */
function agencyFocusOutletColumns() {
  const cols = metricColumnsWithLabel("Outlet", "sku");
  cols.splice(1, 0, { key: "salesman", label: "Salesman" });
  return cols;
}

function renderAgencyFocusPage() {
  const content = $("#content");
  if (!content) return;
  content.innerHTML = "";
  resetPageTableRegistry();

  const cached = state.cache[state.month];
  if (state.loading && !cached) { content.appendChild(el("div", { class: "loading-block" }, ["Loading live data from Google Sheets…"])); return; }
  if (state.error && !cached) { content.appendChild(el("div", { class: "error-block" }, [state.error])); return; }
  if (!cached) { content.appendChild(el("div", { class: "loading-block" }, ["No data loaded yet."])); return; }

  const assigned = assignedAgenciesFor(state.user);
  if (!assigned.length) {
    content.appendChild(el("div", { class: "error-block" }, ["No agency is assigned to this account."]));
    return;
  }

  // Auto-pick the (only) agency for a single-agency user, or the first
  // one alphabetically the first time a multi-agency user opens this page.
  if (!state.pageAgencyFocus.agency || !assigned.includes(state.pageAgencyFocus.agency)) {
    state.pageAgencyFocus = { agency: assigned.slice().sort()[0] };
    currentAgencyFocus = null;
  }

  content.appendChild(el("h2", { class: "page-title" }, ["Agency Focus — " + state.pageAgencyFocus.agency + " — " + MONTHS.find((m) => m.key === state.month).label]));

  if (assigned.length > 1) {
    const selectorWrap = el("div", { class: "outlet-selector" });
    selectorWrap.appendChild(el("label", { class: "field-label" }, ["Select an agency"]));
    const sel = el("select", { class: "input", id: "agencyFocusSelect" }, assigned.slice().sort().map((a) =>
      el("option", { value: a }, [a])
    ));
    sel.value = state.pageAgencyFocus.agency;
    sel.addEventListener("change", () => selectAgencyFocus(sel.value));
    selectorWrap.appendChild(sel);
    content.appendChild(selectorWrap);
  }

  if (agencyFocusError) content.appendChild(el("div", { class: "error-block" }, [agencyFocusError]));
  if (agencyFocusLoading && currentAgencyFocus) {
    content.appendChild(el("div", { class: "updating-banner" }, ["Updating with your new filters — this can take a little while on a slow connection…"]));
  } else if (agencyFocusLoading) {
    content.appendChild(el("div", { class: "loading-block" }, ["Loading " + state.pageAgencyFocus.agency + "'s figures…"]));
  }
  if (!currentAgencyFocus) {
    if (!agencyFocusLoading && !agencyFocusError) content.appendChild(el("div", { class: "loading-block" }, ["Loading…"]));
    return;
  }

  const summary = currentAgencyFocus;
  const agency = state.pageAgencyFocus.agency;
  const wrap = el("div", { class: agencyFocusLoading ? "content-stale" : "" });
  wrap.appendChild(renderKpiCards(summary.overall));

  wrap.appendChild(renderTable("af_promo", "Promo / Regular Performance — " + agency, metricColumnsWithLabel("Type", "outlet"), summary.byPromo, {
    secondaryExpand: {
      columnKey: "distTarget", // "Outlet Dist Target" on this table
      tableId: "af_promo_notsupplied",
      keyOf: (r) => r.label, // the promo/regular value itself (e.g. "PROMO")
      loadDetail: loadAgencyFocusPromoNotSuppliedOutlets,
      detailColumns: NOT_SUPPLIED_OUTLET_COLUMNS,
      detailTitle: (r) => "Outlets not supplied this month — " + r.label + " (" + agency + ")",
      detailRowClass: () => "row-not-supplied",
      emptyText: "Every target outlet for this type has already been supplied this month.",
      buttonTitle: "Show outlets not supplied this month for this type",
      collapseTitle: "Hide not-supplied outlets",
    },
  }));

  // Salesmen-wise sits right after Promo/Regular per explicit request —
  // before the (now unlimited) Outlets/SKUs tables, not after them.
  if (summary.bySalesman) {
    wrap.appendChild(renderTable("af_bysales", "Salesmen-wise Performance — " + agency, SALESMAN_COLUMNS, summary.bySalesman));
  }

  // Full outlet list (not just Top 10) for this locked agency, with an
  // extra Salesman column, and a "+" on SKU Dist Target for the SKUs
  // never supplied at that outlet this month — identical feature to the
  // "All Customers / Outlets" page, just agency-scoped here.
  wrap.appendChild(renderTable("af_outlets", "All Customers / Outlets — " + agency + " — distribution = SKUs at this outlet", agencyFocusOutletColumns(), summary.allOutlets, {
    secondaryExpand: {
      columnKey: "distTarget", // "SKU Dist Target" on this table
      tableId: "af_outlet_notsupplied",
      keyOf: (r) => r._custCode,
      loadDetail: loadAgencyFocusOutletNotSuppliedSkus,
      detailColumns: OUTLET_DETAIL_SKU_COLUMNS,
      detailTitle: (r) => "Not supplied this month at " + r.label + " (" + agency + ")",
      detailRowClass: () => "row-not-supplied",
      emptyText: "Every target SKU has already been supplied at this outlet this month.",
      buttonTitle: "Show SKUs not supplied this month at this outlet",
      collapseTitle: "Hide not-supplied SKUs",
    },
  }));

  // Full SKU list (not just Top 20), with a "+" on Outlet Dist Target for
  // the outlets that haven't been supplied that particular SKU yet.
  wrap.appendChild(renderTable("af_skus", "All SKUs — " + agency + " — distribution = outlets carrying this SKU", metricColumnsWithLabel("SKU", "outlet"), summary.allSkus, {
    secondaryExpand: {
      columnKey: "distTarget", // "Outlet Dist Target" on this table
      tableId: "af_sku_notsupplied",
      keyOf: (r) => r._itemCode,
      loadDetail: loadAgencyFocusSkuNotSuppliedOutlets,
      detailColumns: NOT_SUPPLIED_OUTLET_COLUMNS,
      detailTitle: (r) => "Outlets not supplied this month — " + r.label + " (" + agency + ")",
      detailRowClass: () => "row-not-supplied",
      emptyText: "Every outlet with a target for this SKU has already been supplied this month.",
      buttonTitle: "Show outlets not supplied this month for this SKU",
      collapseTitle: "Hide not-supplied outlets",
    },
  }));

  content.appendChild(renderPageDownloadToolbar("Agency Focus — " + agency + " — " + MONTHS.find((m) => m.key === state.month).label));
  content.appendChild(wrap);
}

/* ---------------------------------------------------------------------
   YESTERDAY'S SALES PAGE — fixed to the real previous calendar day,
   independent of the Month selector and the Agency/etc. filters. Built
   entirely from already-fetched SALES rows (no extra Google queries
   beyond, at most, loading one month's SALES rows if "yesterday" falls
   in a month the user hasn't otherwise opened — e.g. viewing on the 1st
   of a new month).
   --------------------------------------------------------------------- */
async function ensureMonthSalesRows(monthKey) {
  const existing = state.cache[monthKey];
  if (existing && existing.salesRows) return existing;
  const cfg = MONTHS.find((m) => m.key === monthKey);
  if (!cfg) throw new Error("No sheet is set up for " + monthKey + " yet.");
  const salesColMap = await resolveColumnMap(cfg.salesId);
  const roleWhereSales = buildGqlWhere(salesColMap, state.user, {}, { forSales: true });
  const salesRows = await fetchSheetRows(cfg.salesId, roleWhereSales);
  state.cache[monthKey] = Object.assign({}, state.cache[monthKey] || {}, {
    salesRows, salesColMap, salesSheetId: cfg.salesId,
  });
  return state.cache[monthKey];
}

async function fetchAndRenderYesterday() {
  const content = $("#content");
  if (!content) return;
  const y = computeYesterdayKey();
  state.pageYesterday = { loading: true, error: null, data: state.pageYesterday ? state.pageYesterday.data : null, dateLabel: y.label };
  resetExpandable("y_outlet"); // a real refetch invalidates any "+"-expanded SKU breakdowns
  renderYesterdayPage();

  if (!MONTHS.find((m) => m.key === y.monthKey)) {
    state.pageYesterday = { loading: false, error: "No sheet is set up yet for " + y.label + ".", data: null, dateLabel: y.label };
    renderYesterdayPage();
    return;
  }

  try {
    const monthData = await ensureMonthSalesRows(y.monthKey);
    const dayRows = monthData.salesRows.filter((r) => r.lastDate === y.dateKey);
    state.pageYesterday = { loading: false, error: null, data: buildYesterdaySummary(dayRows), dateLabel: y.label };
  } catch (err) {
    state.pageYesterday = { loading: false, error: "Could not load " + y.label + "'s sales: " + err.message, data: state.pageYesterday ? state.pageYesterday.data : null, dateLabel: y.label };
  }
  renderYesterdayPage();
}

const YESTERDAY_COLUMNS_BASE = [
  { key: "label", label: "" },
  { key: "net", label: "Sales", numeric: true, fmt: (v) => fmtNum(v, 0) },
  { key: "return", label: "Return", numeric: true, fmt: (v) => fmtNum(v, 0) },
  { key: "outlets", label: "Outlets", numeric: true, fmt: (v) => fmtNum(v, 0) },
  { key: "skus", label: "SKUs", numeric: true, fmt: (v) => fmtNum(v, 0) },
];
function yesterdayColumnsWithLabel(labelHeader) {
  const cols = YESTERDAY_COLUMNS_BASE.map((c) => Object.assign({}, c));
  cols[0] = { key: "label", label: labelHeader };
  return cols;
}

function renderYesterdayPage() {
  const content = $("#content");
  if (!content) return;
  content.innerHTML = "";
  resetPageTableRegistry();

  const py = state.pageYesterday || {};
  const label = py.dateLabel || computeYesterdayKey().label;
  content.appendChild(el("h2", { class: "page-title" }, ["Yesterday's Sales — " + label]));

  if (py.loading && !py.data) { content.appendChild(el("div", { class: "loading-block" }, ["Loading " + label + "'s sales…"])); return; }
  if (py.error && !py.data) { content.appendChild(el("div", { class: "error-block" }, [py.error])); return; }
  if (!py.data) { content.appendChild(el("div", { class: "loading-block" }, ["No data loaded yet."])); return; }
  if (py.error) content.appendChild(el("div", { class: "error-block" }, [py.error]));
  if (py.loading) content.appendChild(el("div", { class: "updating-banner" }, ["Refreshing…"]));

  const d = py.data;
  const wrap = el("div", { class: py.loading ? "content-stale" : "" });

  const yKpiCards = [
    ["Sales", fmtNum(d.totals.net, 0)],
    ["Return", fmtNum(d.totals.return, 0)],
    ["Outlets Billed", fmtNum(d.totals.outletsBilled, 0)],
    ["SKUs Sold", fmtNum(d.totals.skusSold, 0)],
  ];
  registerTableForDownload("KPI Summary", [{ key: "metric", label: "Metric" }, { key: "value", label: "Value" }], yKpiCards.map(([label2, val]) => ({ metric: label2, value: val })));
  const kpi = el("div", { class: "kpi-grid" }, yKpiCards.map(([label2, val]) => el("div", { class: "kpi-card" }, [
    el("div", { class: "kpi-value" }, [val]),
    el("div", { class: "kpi-label" }, [label2]),
  ])));
  wrap.appendChild(kpi);

  wrap.appendChild(renderExpandableTable(
    "y_outlet",
    "Outlet-wise Sales — " + label + ". Click + on a row for its SKU-wise breakdown.",
    yesterdayColumnsWithLabel("Outlet"),
    d.byOutlet,
    {
      keyOf: (r) => r._key,
      loadDetail: (row) => loadYesterdayOutletSkuDetail(row),
      detailColumns: YESTERDAY_DETAIL_COLUMNS,
      detailTitle: (r) => "SKU-wise sales at " + r.label,
    }
  ));
  wrap.appendChild(renderTable("y_agency", "Agency-wise Sales — " + label, yesterdayColumnsWithLabel("Agency"), d.byAgency));
  wrap.appendChild(renderTable("y_sku", "SKU-wise Sales — " + label, yesterdayColumnsWithLabel("SKU"), d.bySku));

  content.appendChild(renderPageDownloadToolbar("Yesterdays Sales — " + label));
  content.appendChild(wrap);
}

const YESTERDAY_DETAIL_COLUMNS = [
  { key: "label", label: "SKU" },
  { key: "net", label: "Sales", numeric: true, fmt: (v) => fmtNum(v, 0) },
  { key: "return", label: "Return", numeric: true, fmt: (v) => fmtNum(v, 0) },
];

function loadYesterdayOutletSkuDetail(row) {
  const py = state.pageYesterday;
  const dayRows = (py && py.data && py.data.dayRows) || [];
  const scoped = dayRows.filter((r) => r.custCode === row._key);
  return groupSalesRowsBy(scoped, "itemCode", "itemDesc"); // synchronous — no query needed, data's already local
}

   BOOT

document.addEventListener("DOMContentLoaded", () => {
  renderLogin();
});
